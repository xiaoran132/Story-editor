# Story Editor 反向代理（Nginx，宿主机原生）
# 用法：放到 /etc/nginx/conf.d/story-editor.conf（或 sites-available + 软链 sites-enabled），
#   把 server_name 换成你的域名，然后 `nginx -t && systemctl reload nginx`。
#
# 同域反代：/api/v1/* → 后端(8080)，其余 → 前端(3000)。
# 前端用同源相对地址 NEXT_PUBLIC_API_BASE=/api/v1，无跨域、不硬编码域名。
#
# HTTPS：dev 阶段先 listen 80（HTTP）即可；对外前用 `certbot --nginx -d <域名>`
# 自动补 443 + 证书 + HTTP→HTTPS 跳转，这段 server 会被 certbot 就地改写。

server {
    listen 80;
    server_name example.com;   # ← 改成你的域名

    # 后端 API：SSE 流式（开局/续写逐字）必须关缓冲 + HTTP/1.1 长连
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8080;   # 后端端口（若改过 SERVER_PORT，这里同步）
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 8m;     # 图片上传（/api/v1/uploads/image）；默认 1m 会 413
        proxy_buffering off;         # SSE 逐字必须关
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_read_timeout 3600s;    # 长连生成不被掐断
    }

    # 其余全部交给 Next.js 前端
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
