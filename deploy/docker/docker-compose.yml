# Story Editor · Docker 部署（原生 PG 在宿主机上）
# host 网络：三个容器共享宿主网络栈，容器内用 127.0.0.1 直连宿主 PG(5432)与彼此，
# 拓扑与原生一致，无需改 PG 监听/pg_hba。服务器只需装 Docker + compose 插件。
#
# 反代用宿主机原生 nginx（见 deploy/nginx/story-editor.conf），不在 compose 内。
# 首次：填好 agent.env / backend.env（照 *.example）→ docker compose up -d --build
name: story-editor

services:
  agent:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.agent
    image: story-agent
    network_mode: host
    env_file: [./agent.env] # 至少 DEEPSEEK_API_KEY
    restart: unless-stopped

  backend:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.backend
    image: story-backend
    network_mode: host
    env_file: [./backend.env] # DB_*/JWT_SECRET/AGENT_URL/SERVER_PORT/UPLOAD_*
    # 上传的头像/封面落在容器内本地磁盘，必须挂持久卷，否则 up --build 一次就全没了。
    # 路径要与 backend.env 的 UPLOAD_DIR 一致。
    volumes:
      - uploads:/data/uploads
    depends_on: [agent]
    restart: unless-stopped

  frontend:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_BASE: /api/v1 # 同源相对地址，随镜像固化
    image: story-frontend
    network_mode: host
    environment:
      HOSTNAME: 127.0.0.1 # standalone 只监听本机，仅经 nginx 暴露
      PORT: "3000"
      NODE_ENV: production
    depends_on: [backend]
    restart: unless-stopped
volumes:
  uploads: # 用户上传的头像/作品封面（本地磁盘存储，见 backend/internal/service/upload.go）

# 反代：宿主机原生 nginx，配置见 deploy/nginx/story-editor.conf
# （80/443 由宿主 nginx 占，容器只监听 127.0.0.1 的 8001/8080/3000）
