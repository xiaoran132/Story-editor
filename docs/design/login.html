<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="万象 · 登录 —— 你来之前，这里什么都没有。" />
<title>进入万象 · Story Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;510;590&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  /* 注册 --hue 后才能对色相做过渡；不支持的浏览器直接跳变，不影响功能。 */
  @property --hue{ syntax:'<number>'; inherits:true; initial-value:252 }

  :root{
    --bg:        oklch(0.13 0.022 265);
    --bg-deep:   oklch(0.09 0.018 265);
    --surface:   oklch(0.19 0.030 265);
    --fg:        oklch(0.96 0.010 90);
    --muted:     oklch(0.72 0.020 265);
    --border:    oklch(1 0 0 / 0.11);
    --border-2:  oklch(1 0 0 / 0.20);
    --accent:    oklch(0.82 0.125 85);      /* 暖金 · 全站唯一强调 */
    --accent-dim:oklch(0.66 0.100 85);

    --font-display:"Noto Serif SC", Georgia, "Songti SC", serif;
    --font-ui:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;

    --r-sm:8px; --r-md:12px; --r-lg:18px; --r-pill:999px;
    --ease:cubic-bezier(.2,0,0,1);
    --ring:0 0 0 2px oklch(0.09 0.018 265), 0 0 0 4px oklch(0.82 0.125 85);
  }

  /* 世界作用域：只设 --hue，下列角色 token 全部自动重算。
     L / C 写死，只有 H 变 —— 换色相时明度层级不会崩。
     必须声明在使用它的元素（.scene）上，不能放 :root。 */
  .world-scope{
    --w-line:   oklch(0.72 0.140 var(--hue) / .85);
    --w-glow:   oklch(0.72 0.140 var(--hue) / .50);
    --w-sky-hi: oklch(0.34 0.115 var(--hue));
    --w-sky-md: oklch(0.22 0.085 var(--hue));
    --w-sky-lo: oklch(0.11 0.040 var(--hue));
    --w-halo:   oklch(0.48 0.130 var(--hue) / .75);
    --w-cloud:  oklch(0.20 0.050 var(--hue) / .85);
    --w-cloud2: oklch(0.44 0.090 var(--hue) / .50);
    --w-star:   oklch(0.98 0.020 var(--hue) / .90);
    --w-ink:    oklch(0.055 0.015 var(--hue));
    /* 本页新增两档云色。§4 那两档是给小卡片用的:--w-cloud(0.20) 比
       --w-sky-md(0.22) 还暗,铺满整屏时等于没画。这两档比它盖住的天空亮。 */
    --w-cloud-a:oklch(0.36 0.070 var(--hue) / .78);
    --w-cloud-b:oklch(0.48 0.098 var(--hue) / .50);
    /* 地平线余光:全页唯一让纯黑剪影读得出轮廓的光源(同 404.html 的 groundGlow) */
    --w-ground: oklch(0.34 0.036 var(--hue) / .74);
    --w-ground2:oklch(0.20 0.026 var(--hue) / .36);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html{height:100%}
  body{
    min-height:100dvh; overflow-x:hidden;
    background:var(--bg-deep); color:var(--fg);
    font-family:var(--font-ui); -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer;color:inherit}
  button:disabled{cursor:not-allowed}
  a{color:inherit;text-decoration:none}
  /* 焦点环用 box-shadow，它自动跟随元素本身的 border-radius。
     这里不再统一改写 border-radius —— 否则胶囊主 CTA 一聚焦就变成方角。 */
  :focus-visible{outline:none;box-shadow:var(--ring)}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}

  /* ==========================================================
     场景 —— 这一整块就是「被写出来的世界」
     L0 什么都没有 → L5 完整。逐层揭示，且只进不退。
     ========================================================== */
  .stage{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--bg-deep)}
  .scene{position:absolute;inset:0;transition:--hue 1.1s var(--ease)}
  .scene > *{pointer-events:none}

  /* ⚠️ 幅度分配是这一页的成败所在。
     初版把整片天空一次性给了 L1，L2 的云比它盖住的天空还暗、L3 只有 38 颗
     1.4px 的点——实际观感是「黑 → 整片天空 → 什么都没有 → 流星」，逐层生成
     完全没立起来。现在天空的高度与浓度跟着层级一路长，每一层都有可指认的新东西。 */

  /* L1–L3 远层天空：从地平线向上持续长高，不是一次铺满 */
  .sky-grad{position:absolute;inset:0;opacity:0;
    transform:scaleY(.30);transform-origin:50% 100%;
    /* ⚠️ 亮端在下、暗端在上，和 home-galaxy 的卡片天空相反。两个理由：
       ① 暮色本来就是地平线最亮、天顶最暗；
       ② L1/L2 是 scaleY<1 的稳定态，天空顶端有一条硬切边。把最暗的
          --w-sky-lo(0.11) 放在顶端，切边与 --bg-deep(0.09) 只差 0.02 L，
          肉眼看不出来；若把亮端放上面，那条边会变成一道假地平线。 */
    background:linear-gradient(180deg, var(--w-sky-lo) 0%, var(--w-sky-md) 52%, var(--w-sky-hi) 100%);
    transition:opacity .9s var(--ease), transform .9s var(--ease)}
  .lv1 .sky-grad{opacity:.52;transform:scaleY(.62)}
  .lv2 .sky-grad{opacity:.80;transform:scaleY(.84)}
  .lv3 .sky-grad{opacity:1;transform:none}

  /* L4 天顶辉光：最后一层才亮起，天空到这里才算完整 */
  .halo{position:absolute;inset:0;opacity:0;
    background:radial-gradient(96% 54% at 74% 2%, var(--w-halo), transparent 66%);
    transition:opacity 1s var(--ease)}
  .lv4 .halo{opacity:1}

  /* L2 云层：只有远云一层极缓漂移，近云静态构图。
     柔边用径向渐变而不是 filter:blur —— c1 是持续动画元素，
     挂 filter 会让每帧都重算滤镜（纪律同星图光晕，见 DESIGN.md §6）。 */
  .cloud{position:absolute;opacity:0;transform:translateY(22px);
    transition:opacity .7s var(--ease), transform .7s var(--ease)}
  .cloud.c1{width:160%;height:34%;left:-30%;bottom:17%;
    background:radial-gradient(closest-side, var(--w-cloud-a) 0%, var(--w-cloud-a) 26%, transparent 100%)}
  .cloud.c2{width:104%;height:25%;left:30%;bottom:30%;
    background:radial-gradient(closest-side, var(--w-cloud-b) 0%, var(--w-cloud-b) 22%, transparent 100%)}
  .cloud.c3{width:82%;height:19%;left:-16%;bottom:40%;
    background:radial-gradient(closest-side, var(--w-cloud-b) 0%, var(--w-cloud-b) 18%, transparent 100%)}
  .lv2 .cloud{opacity:1;transform:none}
  /* 延迟到升起过渡结束后再接管 transform，否则入场的「升起」被动画吃掉 */
  .lv2 .cloud.c1{animation:drift 78s .7s linear infinite}
  @keyframes drift{0%{transform:translateX(0)}50%{transform:translateX(4.2%)}100%{transform:translateX(0)}}

  /* L3 星点：确定性坐标，刷新不变；逐颗错峰亮起，不闪烁 */
  .starfield{position:absolute;inset:0 0 34% 0}
  .starfield i{position:absolute;display:block;border-radius:50%;background:var(--w-star);
    opacity:0;transform:scale(.3);
    transition:opacity .5s var(--ease), transform .5s var(--ease)}
  .lv3 .starfield i{opacity:var(--o);transform:none}

  /* L4 流星：只划一次，不循环 */
  .meteor{position:absolute;left:16%;top:13%;width:0;height:1px;opacity:0;
    background:linear-gradient(90deg, transparent, var(--w-star));
    transform:rotate(26deg);transform-origin:left center}
  .lv4 .meteor{animation:shoot 1.15s .12s var(--ease) forwards}
  @keyframes shoot{
    0%{opacity:0;width:0}
    22%{opacity:1}
    72%{opacity:1;width:190px}
    100%{opacity:0;width:230px}
  }

  /* 地平线遮罩：任何层级都在，是「地面」本身 */
  .horizon{position:absolute;left:0;right:0;bottom:0;height:36%;
    background:linear-gradient(180deg, transparent, var(--w-ink) 58%, oklch(0.045 0.012 265) 100%)}

  /* ⚠️ L0 的地平线余光 —— 全页唯一让纯黑剪影读得出轮廓的光源，不是装饰。
     剪影 --w-ink 是 oklch(0.055…)，地面也压到同一档：没有这枚余光，L0 就是
     一块全黑的屏幕，人站在那里但谁也看不见。做法同 404.html 的 groundGlow。
     天上仍然什么都没有——没有渐变、没有云、没有星，「空」的叙事不受影响。
     必须叠在 .horizon 之上、.figure 之下，否则会被地面遮罩压掉。 */
  .glow{position:absolute;left:27%;bottom:8%;width:min(66vw,680px);height:34vh;
    transform:translateX(-50%);opacity:1;
    background:radial-gradient(closest-side,
      var(--w-ground) 0%, var(--w-ground2) 54%, transparent 100%);
    transition:opacity .9s var(--ease)}
  /* 天空长起来之后余光让位，但不撤走——剪影任何层级都要读得出 */
  .lv3 .glow{opacity:.62}

  /* L5 暖金地平线 —— 全页第 2 处暖金，此时主 CTA 已退成描边确认态 */
  .horizon-line{position:absolute;left:8%;right:8%;bottom:19%;height:1px;
    background:linear-gradient(90deg, transparent, var(--accent) 22%, var(--accent) 78%, transparent);
    opacity:0;transform:scaleX(.28);
    transition:opacity .65s var(--ease), transform .65s var(--ease)}
  .lv5 .horizon-line{opacity:.9;transform:none}

  /* 剪影：纯黑零细节，姿态即状态。三态交叉淡入，不重绘 SVG */
  .figure{position:absolute;left:27%;bottom:19%;width:clamp(74px,9.5vw,116px);
    aspect-ratio:100/92;color:var(--w-ink)}
  .figure svg{position:absolute;inset:0;width:100%;height:100%;display:block;
    opacity:0;transition:opacity .32s var(--ease), transform .32s var(--ease)}
  .figure .fig-walk{opacity:1;transform:scaleX(-1)}   /* 背对着你走 */
  .scene.pose-gaze  .fig-walk,
  .scene.pose-reach .fig-walk{opacity:0}
  .scene.pose-gaze  .fig-gaze{opacity:1}
  .scene.pose-reach .fig-reach{opacity:1}

  /* 右侧读盖：让表单区始终高于 AA 对比，与天空亮度无关 */
  /* 读盖只负责保住面板区对比度，不负责把天空压黑：压过头会让逐层生成看不见 */
  .veil{position:absolute;inset:0;
    background:linear-gradient(94deg, transparent 46%, oklch(0.055 0.014 265 / .38) 72%,
      oklch(0.05 0.012 265 / .74) 100%)}
  .grain{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.045;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
    background-size:140px 140px}

  /* ==========================================================
     前景
     ========================================================== */
  .brandmark{position:fixed;top:26px;left:30px;z-index:20;
    display:flex;align-items:center;gap:10px;font-weight:590;font-size:15px;letter-spacing:.02em}
  .brandmark .mark{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;
    background:oklch(1 0 0 / .05);border:1px solid var(--border)}
  .brandmark .zh{font-family:var(--font-display);font-weight:700;font-size:16px;letter-spacing:.1em}
  .brandmark .en{color:var(--muted);font-size:11.5px;letter-spacing:.16em;padding-left:10px;
    border-left:1px solid var(--border)}

  .shell{position:relative;z-index:10;min-height:100dvh;display:flex;align-items:center;
    justify-content:flex-end;padding:96px 6vw 48px}
  .panel{width:min(400px,100%);
    background:oklch(0.10 0.018 265 / .72);border:1px solid var(--border);
    border-radius:var(--r-lg);padding:30px 30px 26px;
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    box-shadow:0 34px 90px -46px oklch(0.02 0 0 / .95)}

  .eyebrow{font-size:11px;letter-spacing:.26em;color:var(--muted);font-weight:590;margin-bottom:15px}
  .title{position:relative;font-family:var(--font-display);font-weight:900;
    font-size:clamp(28px,3.2vw,38px);line-height:1.34;letter-spacing:0;min-height:1.34em}
  .title span{display:block;transition:opacity .34s var(--ease)}
  .title .t-done{position:absolute;inset:0;opacity:0}
  .scene-done .title .t-empty{opacity:0}
  .scene-done .title .t-done{opacity:1}

  .lede{margin-top:14px;font-size:13.5px;line-height:1.85;color:var(--muted)}

  form{margin-top:24px}
  .field{display:block}
  .field label{display:block;font-size:12px;letter-spacing:.08em;font-weight:590;
    color:var(--muted);margin-bottom:9px}
  .field input{width:100%;height:50px;padding:0 15px;border-radius:var(--r-sm);
    background:oklch(1 0 0 / .05);border:1px solid var(--border-2);color:var(--fg);
    font-family:var(--font-ui);font-size:14.5px;letter-spacing:.01em;
    transition:background .16s var(--ease), border-color .16s var(--ease)}
  /* 0.58 叠在半透明面板上实测约 4.3:1，低于 AA 的 4.5:1；提到 0.66 后约 5.7:1 */
  .field input::placeholder{color:oklch(0.66 0.018 265)}
  .field input:hover{background:oklch(1 0 0 / .09);border-color:oklch(1 0 0 / .30)}
  .field input:focus-visible{background:oklch(1 0 0 / .09);border-color:var(--accent);
    box-shadow:var(--ring)}
  .field input[aria-invalid="true"]{border-color:oklch(0.70 0.155 27)}

  .err{display:none;margin-top:9px;font-size:12.5px;line-height:1.6;color:oklch(0.80 0.135 27)}
  .err.on{display:block}

  .actions{display:flex;align-items:center;gap:16px;margin-top:22px;flex-wrap:wrap}
  /* 全页唯一的实心主 CTA */
  .btn-go{height:50px;padding:0 26px;border:0;border-radius:var(--r-pill);
    background:var(--accent);color:oklch(0.16 0.03 85);
    font-size:15px;font-weight:590;letter-spacing:.03em;
    display:inline-flex;align-items:center;gap:9px;
    transition:background .16s var(--ease), transform .1s var(--ease)}
  .btn-go:hover{background:oklch(0.90 0.135 85)}
  .btn-go:active{transform:translateY(1px)}
  /* ⚠️ 忙碌态用 aria-disabled 而不是 disabled 属性。提交时焦点正在这个按钮上，
     一旦真禁用，焦点会掉回 body，键盘用户失去位置。拦截交给 JS 的 busy 标志。 */
  .btn-go[aria-disabled="true"]{background:var(--accent-dim);color:oklch(0.24 0.03 85);
    cursor:progress}
  .btn-go[aria-disabled="true"]:hover{background:var(--accent-dim)}
  .btn-go[aria-disabled="true"]:active{transform:none}
  .btn-quiet{min-height:44px;display:inline-flex;align-items:center;gap:6px;padding:0 10px;
    background:none;border:0;border-radius:var(--r-sm);color:var(--muted);
    font-size:13.5px;letter-spacing:.02em;transition:color .15s var(--ease)}
  .btn-quiet:hover{color:var(--fg)}

  /* 面板是半透明的，底下天空亮起来后 0.60 会掉到 4.5:1 边缘，提到 0.66 保住余量 */
  .note{margin-top:20px;padding-top:16px;border-top:1px solid var(--border);
    font-size:11.5px;line-height:1.8;color:oklch(0.66 0.018 265)}

  /* 确认态：在原位置替换，面板不位移、不飞走 */
  .done{display:none}
  .done.on{display:block}
  /* 程序化聚焦的容器不该画焦点环——环是给键盘导航的，这里只是把朗读起点挪过来 */
  .done:focus{outline:none}
  form.off{display:none}
  .done .mailback{margin-top:18px;padding:13px 15px;border-radius:var(--r-sm);
    background:oklch(1 0 0 / .05);border:1px solid var(--border);
    font-size:13.5px;line-height:1.6;color:var(--fg);overflow-wrap:anywhere}
  .done .mailback b{font-weight:590}
  /* 确认勾用中性亮态，不占暖金配额（此时配额已给品牌标记 + 暖金地平线）。
     也不取 --w-* ：那组 token 声明在 .scene 上，面板不在它的作用域内。 */
  .done-icon{display:inline-flex;align-items:center;justify-content:center;
    width:34px;height:34px;border-radius:50%;margin-bottom:16px;
    border:1px solid var(--border-2);color:oklch(0.88 0.008 265);background:oklch(1 0 0 / .05)}

  /* ================= 响应式：小屏是重新编排，不是压扁 =================
     ⚠️ 手机上不能沿用「场景满屏 fixed + 面板浮在其上」。360×640 实测面板高
     约 420px,而剪影在 bottom:44%(≈282px)——**面板会把人整个盖住**,
     「人小天大」在手机上直接不存在。这是硬性的元素重叠,不是观感问题。

     改法:小屏把场景收成**顶部一条带**,面板排在它下面的常规流里。
     场景内部所有百分比都相对 .stage,带高一改整套构图按比例重算,
     不需要逐个元素挪位置。页面因此可纵向滚动,面板再高也压不到人。 */
  @media(max-width:900px){
    .stage{position:absolute;inset:0 0 auto 0;height:44vh}
    .shell{display:block;min-height:0;padding:calc(44vh + 24px) 20px 32px}
    .panel{width:min(440px,100%);margin:0 auto}
    /* 竖向读盖:把场景底边化进页面底色,否则条带下沿会留一条硬缝
       (.horizon 末端 oklch(0.045…) 比 --bg-deep(0.09) 更深) */
    .veil{background:linear-gradient(180deg, transparent 50%,
      oklch(0.07 0.016 265 / .55) 78%, var(--bg-deep) 100%)}
    .figure{width:clamp(52px,10vw,74px)}
    /* 余光的 height 是 vh(视口)不是 %(场景)，场景收成 44vh 后必须一起收，
       否则一枚 34vh 的光池几乎盖满整条带，天空全被冲白 */
    .glow{width:min(70vw,400px);height:16vh}
    /* 顶栏改 absolute：fixed 的话滚动看表单时它会一直浮在面板上方压住内容 */
    .brandmark{position:absolute;top:18px;left:18px}
  }
  @media(max-width:560px){
    .stage{height:38vh}
    .shell{padding:calc(38vh + 20px) 14px 26px}
    .panel{padding:24px 20px 22px;border-radius:var(--r-md)}
    .lede{margin-top:12px;font-size:13px;line-height:1.75}
    .figure{width:clamp(46px,12vw,64px)}
    .glow{width:min(78vw,330px);height:13vh}
    .horizon-line{left:5%;right:5%}
    .brandmark .en{display:none}
    /* 实测 360px 下面板内宽 280px:「让它开始」138px +「先逛逛」61px + gap
       完全放得下。btn-go 满宽只会逼按钮组折行,白吃 54px 高度。 */
    .actions{gap:10px}
  }

  /* 减动效：静止态就是最终态（L4 的完整天空），不是隐藏态 */
  @media (prefers-reduced-motion: reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

<div class="stage" aria-hidden="true" data-od-id="login-stage">
  <div class="scene world-scope" id="scene" style="--hue:252">
    <div class="sky-grad"></div>
    <div class="halo"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
    <div class="starfield" id="starfield"></div>
    <div class="meteor"></div>
    <div class="horizon"></div>
    <div class="glow"></div>
    <div class="horizon-line"></div>
    <div class="figure">
      <svg class="fig-walk" viewBox="0 0 100 92"><g fill="currentColor" stroke="currentColor">
        <circle cx="50" cy="14" r="7.4"/>

        <path d="M45.6 47 43.6 80" stroke-width="6" stroke-linecap="round" fill="none"/>

        <path d="M45.6 47 43.6 80" stroke-width="6" stroke-linecap="round" fill="none"/>

<div class="brandmark" data-od-id="brandmark">

<main class="shell" data-od-id="login-shell">
  <section class="panel" aria-labelledby="login-title" data-od-id="login-panel">
    <p class="eyebrow">万象 · 无穷世界</p>
    <h1 class="title" id="login-title" data-od-id="login-title">
      <span class="t-empty">这里还没有故事。</span>
      <span class="t-done" aria-hidden="true">现在有了。</span>
    </h1>
    <p class="lede" id="lede" data-od-id="login-lede">
      留下邮箱，我们寄一条进入的链接给你。你写下的每一个字符，都会让这片天空多长出一层。
    </p>

    <form id="form" novalidate data-od-id="login-form">
      <div class="field">
        <label for="email">邮箱</label>
        <input id="email" name="email" type="email" inputmode="email"
               autocomplete="email" spellcheck="false"
               placeholder="you@example.com"
               aria-describedby="err" data-od-id="input-email" />
        <!-- ⚠️ 故意留空:role=alert 靠**内容变化**触发。文案写死、只切 display，
             NVDA / JAWS 大概率不播报。文案由 JS 注入,清除时置空。 -->
        <p class="err" id="err" role="alert" data-od-id="email-error"></p>
      </div>
      <div class="actions">
        <button class="btn-go" type="submit" id="submit" data-od-id="cta-start">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h13M13 6l6 6-6 6"/>
          </svg>
          <span id="submit-label">让它开始</span>
        </button>
        <a class="btn-quiet" href="home-galaxy.html" data-od-id="cta-browse">先逛逛</a>
      </div>
      <p class="note">前端原型 · 不会真的发送邮件。</p>
    </form>

    <div class="done" id="done" role="status" aria-live="polite" tabindex="-1" data-od-id="login-done">
      <h2 class="sr-only">进入链接已寄出</h2>
      <span class="done-icon" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 9.5 18 20 7"/></svg>
      </span>
      <p class="lede" id="done-lede">进入的链接已经寄出了。</p>
      <p class="mailback">寄往 <b id="mail-echo"></b></p>
      <div class="actions">
        <button class="btn-quiet" type="button" id="btn-again" data-od-id="cta-change-email">← 换一个邮箱</button>
        <a class="btn-quiet" href="home-galaxy.html" data-od-id="cta-enter-galaxy">直接进星海</a>
      </div>
      <p class="note">前端原型 · 邮件不会真的送达。</p>
    </div>
  </section>
</main>

<script>
(function(){
  'use strict';
  var RM = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var INTRO_SEEN_KEY = 'wanxiang-intro-seen-v1';   /* 与 home-galaxy.html 同键 */
  var HUE_ENTER = 252, HUE_DONE = 276;

  var scene   = document.getElementById('scene');
  var panel   = document.querySelector('.panel');
  var form    = document.getElementById('form');
  var email   = document.getElementById('email');
  var err     = document.getElementById('err');
  var submit  = document.getElementById('submit');
  var subLabel= document.getElementById('submit-label');
  var done    = document.getElementById('done');
  var lede    = document.getElementById('lede');
  var mailEcho= document.getElementById('mail-echo');

  /* ---------- L3 星点：固定 seed，刷新不变 ----------
     数量与尺寸不是随便定的：初版 38 颗 1.4px 撒在整块视口上肉眼看不出变化，
     L3 等于没发生。参照 home-galaxy.html 的 150 颗量级，这里取 128 颗并分三档大小。
     错峰用 (i % 18)，让星像扫过一遍地亮起而不是排成一条 5 秒长队。 */
  (function(){
    var box = document.getElementById('starfield'), html = '', s = 9301, i;
    function rnd(){ s = (s * 9301 + 49297) % 233280; return s / 233280; }
    for(i = 0; i < 128; i++){
      var r = rnd();
      var size = r < 0.68 ? 1.6 : (r < 0.92 ? 2.4 : 3.2);
      var o = (0.38 + rnd() * 0.56).toFixed(2);
      html += '<i style="left:' + (rnd() * 100).toFixed(2) + '%;top:' + (rnd() * 100).toFixed(2)
            + '%;width:' + size + 'px;height:' + size + 'px;--o:' + o
            + ';transition-delay:' + (RM ? 0 : (i % 18) * 28) + 'ms"></i>';
    }
    box.innerHTML = html;
  })();

  /* ==========================================================
     世界生成：只进不退
     删字只回退校验状态，不回收已经生成的天空 —— 改一个错字
     不该让整个宇宙闪一下就没了。世界一旦长出来就留着。
     ========================================================== */
  var maxLevel = 0;
  var wcTimer = null;
  function reach(n){
    if(n <= maxLevel) return;
    for(var i = maxLevel + 1; i <= n; i++) scene.classList.add('lv' + i);
    maxLevel = n;
    if(RM) return;
    /* 生成期间才占合成层，落定后释放 */
    scene.style.willChange = 'opacity, transform';
    clearTimeout(wcTimer);
    wcTimer = setTimeout(function(){ scene.style.willChange = 'auto'; }, 1400);
  }
  function pose(name){
    scene.classList.remove('pose-gaze', 'pose-reach');
    if(name) scene.classList.add('pose-' + name);
  }

  /* ---------- 校验 ---------- */
  var RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
  function isValid(v){ return RE.test(v.trim()); }
  var ERR_TEXT = '请输入有效的邮箱地址，例如 you@example.com。';
  function clearError(){
    err.classList.remove('on');
    err.textContent = '';                 /* 置空，下次注入才算「内容变化」 */
    email.removeAttribute('aria-invalid');
  }
  function showError(){
    err.classList.add('on');
    err.textContent = ERR_TEXT;           /* role=alert 靠内容变化触发播报 */
    email.setAttribute('aria-invalid', 'true');
  }

  /* ---------- 输入驱动的层级推进 ---------- */
  email.addEventListener('focus', function(){ reach(1); });
  email.addEventListener('input', function(){
    var v = email.value.trim();
    var at = v.indexOf('@');
    if(err.classList.contains('on') && isValid(v)) clearError();

    if(at === -1){
      if(v.length >= 3) reach(2);
    }else{
      if(at >= 1) reach(2);
      if(v.length > at + 1) reach(3);
      if(isValid(v)){ reach(4); pose('gaze'); }
    }
  });

  /* ---------- 提交 ---------- */
  var busy = false;
  form.addEventListener('submit', function(e){
    e.preventDefault();
    if(busy) return;
    var v = email.value.trim();
    if(!isValid(v)){
      showError();
      email.focus();
      return;                       /* 无效邮箱不推进层级，不伪造「已生成」 */
    }
    clearError();
    busy = true;
    /* 不用 disabled：焦点此刻就在这个按钮上，真禁用会把焦点弹回 body。
       重复提交由 busy 标志拦，读屏用 aria-disabled + aria-busy 得到状态。 */
    submit.setAttribute('aria-disabled', 'true');
    form.setAttribute('aria-busy', 'true');
    subLabel.textContent = '正在开启…';

    setTimeout(function(){
      reach(5);
      pose('reach');
      scene.style.setProperty('--hue', HUE_DONE);
      panel.classList.add('scene-done');
      document.querySelector('.t-empty').setAttribute('aria-hidden', 'true');
      document.querySelector('.t-done').removeAttribute('aria-hidden');

      mailEcho.textContent = v;
      form.classList.add('off');
      done.classList.add('on');

      /* 登录页已经演过一遍「世界生成」，进星海不必再播 2.6s 开屏 */
      try{ window.localStorage.setItem(INTRO_SEEN_KEY, '1'); }catch(error){}

      busy = false;
      submit.removeAttribute('aria-disabled');
      form.removeAttribute('aria-busy');
      subLabel.textContent = '让它开始';
      /* 焦点落到确认区容器而不是「换一个邮箱」：容器里有 sr-only 标题，
         读屏能听到「进入链接已寄出」这个上下文，而不是孤零零一个按钮名。 */
      done.focus();
    }, RM ? 0 : 650);
  });

  /* ---------- 换一个邮箱：世界保留，只回到可编辑态 ---------- */
  document.getElementById('btn-again').addEventListener('click', function(){
    done.classList.remove('on');
    form.classList.remove('off');
    lede.textContent = '改好邮箱，我们重新寄一次。这片天空已经长出来了，不会再收回去。';
    clearError();
    email.focus();
    email.select();
  });

  /* ---------- 减动效：直接落在 L4 的完整天空 ---------- */
  if(RM){
    scene.classList.add('lv1', 'lv2', 'lv3', 'lv4');
    maxLevel = 4;
    pose('gaze');
  }
})();
</script>
</body>
</html>
