<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="我的空间 · 我的创作(草稿/已发布)与我在读(存档续玩)。" />
<title>我的空间 · Story Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;510;590;700&family=Noto+Serif+SC:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff; --surface:#f7f8fa; --surface-2:#eef1f5; --fg:#111111; --muted:#5b626e; --border:#e7e9ef;
    --accent:#1677ff; --accent-ink:#0b5fd0; --success:#17a34a; --warn:#b4690e; --danger:#b4232f;
    --r-sm:8px; --r-md:10px; --r-lg:14px; --r-pill:999px; --ring:0 0 0 3px rgba(22,119,255,.35); --ease:cubic-bezier(.2,0,0,1);
    --sans:"Inter",system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;
    --serif:"Noto Serif SC",Georgia,"Songti SC",serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--surface);color:var(--fg);font-family:var(--sans);-webkit-font-smoothing:antialiased;line-height:1.5}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
  :focus-visible{outline:none;box-shadow:var(--ring);border-radius:var(--r-sm)}
  button{font-family:inherit;cursor:pointer}
  a{color:inherit;text-decoration:none}

  header{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.86);backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--border)}
  .hd{max-width:1080px;margin:0 auto;padding:0 24px;height:60px;display:flex;align-items:center;gap:22px}
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;flex:none}
  .brand .g{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--fg)}
  .nav{display:flex;gap:4px}
  .nav a{padding:7px 12px;border-radius:8px;color:var(--muted);font-size:14px;font-weight:510;letter-spacing:.01em}
  .nav a[aria-current="page"],.nav a:hover{color:var(--fg);background:var(--surface)}
  .hd .sp{margin-left:auto;display:flex;align-items:center;gap:12px}
  .btn{height:38px;padding:0 16px;border:1px solid transparent;border-radius:var(--r-md);font-size:13.5px;font-weight:590;letter-spacing:.01em;
    display:inline-flex;align-items:center;gap:7px;transition:background .15s var(--ease),border-color .15s var(--ease),transform .09s}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--fg);color:#fff}.btn.primary:hover{background:#000}
  .btn.secondary{background:var(--bg);color:var(--fg);border-color:var(--border)}.btn.secondary:hover{border-color:#c7ccd6;background:var(--surface)}
  .btn.accent{background:var(--accent);color:#fff}.btn.accent:hover{background:var(--accent-ink)}
  .btn.ghost{background:transparent;color:var(--fg)}.btn.ghost:hover{background:var(--surface)}
  .btn.danger{background:transparent;color:var(--danger);border-color:var(--border)}.btn.danger:hover{border-color:var(--danger)}
  .btn.sm{height:32px;padding:0 12px;font-size:13px}
  .avatar{width:34px;height:34px;border-radius:50%;border:0;padding:0}

  .wrap{max-width:1080px;margin:0 auto;padding:28px 24px 90px}

  /* 资料条 */
  .profile{display:flex;align-items:center;gap:18px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r-lg);
    padding:22px 24px;box-shadow:0 1px 2px rgba(17,17,17,.04)}
  .profile .pic{width:64px;height:64px;border-radius:50%;flex:none;background:linear-gradient(135deg,#f59e0b,#e11d48)}
  .profile .who h1{font-family:var(--serif);font-size:22px;font-weight:700;line-height:1.35}
  .profile .who p{color:var(--muted);font-size:13.5px;margin-top:4px}
  .profile .nums{margin-left:auto;display:flex;gap:26px;text-align:center}
  .profile .nums b{display:block;font-size:20px;font-weight:590;font-variant-numeric:tabular-nums}
  .profile .nums span{font-size:12px;color:var(--muted);letter-spacing:.01em}
  .profile .edit{align-self:flex-start}
  @media(max-width:640px){.profile{flex-wrap:wrap}.profile .nums{margin-left:0;width:100%;justify-content:space-between;gap:0;order:3}}

  /* Tabs */
  .tabs{display:flex;gap:2px;margin:24px 0 18px;border-bottom:1px solid var(--border)}
  .tabs button{height:44px;padding:0 4px;margin-right:22px;border:0;background:transparent;color:var(--muted);font-size:15px;font-weight:510;
    position:relative;letter-spacing:.01em}
  .tabs button[aria-selected="true"]{color:var(--fg);font-weight:590}
  .tabs button[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--fg);border-radius:2px}
  .tabs button .c{font-size:12px;color:var(--muted);margin-left:5px;font-variant-numeric:tabular-nums}

  .panel{display:none}.panel.on{display:block}

  /* 我的创作 */
  .works{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
  @media(max-width:680px){.works{grid-template-columns:1fr}}
  .work{display:flex;gap:14px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px;
    box-shadow:0 1px 2px rgba(17,17,17,.04)}
  .work .cov{width:88px;height:110px;flex:none;border-radius:var(--r-md);color:#fff;padding:10px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
  .work .cov .k{font-size:9.5px;font-weight:700;letter-spacing:.1em;opacity:.9}
  .work .cov .ct{font-family:var(--serif);font-weight:900;font-size:14px;line-height:1.3;text-shadow:0 1px 8px rgba(0,0,0,.3)}
  .work .info{display:flex;flex-direction:column;min-width:0;flex:1}
  .work .trow{display:flex;align-items:center;gap:8px}
  .work h3{font-family:var(--serif);font-size:16px;font-weight:700;line-height:1.35}
  .badge{font-size:10.5px;font-weight:590;letter-spacing:.03em;padding:3px 8px;border-radius:var(--r-pill);flex:none}
  .badge.pub{background:#e7f6ec;color:#0f7a37}
  .badge.draft{background:var(--surface-2);color:var(--muted)}
  .work .meta{font-size:12px;color:var(--muted);margin-top:6px;letter-spacing:.01em;font-variant-numeric:tabular-nums}
  .work .acts{margin-top:auto;display:flex;gap:8px;padding-top:12px}
  .newwork{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border:1.5px dashed var(--border);
    border-radius:var(--r-lg);background:transparent;color:var(--muted);min-height:138px;font-size:14px;font-weight:510}
  .newwork:hover{border-color:var(--accent);color:var(--accent-ink);background:var(--bg)}
  .newwork .plus{width:36px;height:36px;border-radius:50%;background:var(--surface);display:grid;place-items:center}

  /* 我在读 */
  .saves{display:flex;flex-direction:column;gap:12px}
  .save{display:flex;align-items:center;gap:14px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 16px}
  .save .cov{width:44px;height:56px;flex:none;border-radius:8px}
  .save .info{min-width:0;flex:1}
  .save h3{font-family:var(--serif);font-size:15.5px;font-weight:700}
  .save .prog{font-size:12.5px;color:var(--muted);margin-top:3px;letter-spacing:.01em}
  .save .acts{display:flex;gap:8px;align-items:center}
  .confirm{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--danger)}

  /* 空态 */
  .empty{text-align:center;padding:56px 24px;border:1px dashed var(--border);border-radius:var(--r-lg);background:var(--bg)}
  .empty .ic{width:52px;height:52px;border-radius:50%;background:var(--surface);color:var(--muted);display:grid;place-items:center;margin:0 auto 14px}
  .empty h3{font-family:var(--serif);font-size:18px;font-weight:700;margin-bottom:6px}
  .empty p{color:var(--muted);font-size:14px;line-height:1.7;margin-bottom:18px}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);z-index:70;background:var(--fg);color:#fff;
    padding:11px 18px;border-radius:var(--r-md);font-size:13px;opacity:0;transition:.25s var(--ease);pointer-events:none}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="hd">
    <a class="brand" href="home-discover.html"><span class="g" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19.5v-6M12 13.5 7.7 8.9M12 13.5l4.3-4.6"/><circle cx="12" cy="20" r="1.4" fill="#fff" stroke="none"/><circle cx="7.4" cy="8.3" r="2.3" fill="#1677ff" stroke="none"/><circle cx="16.6" cy="8.3" r="2.3" fill="#fff" stroke="none"/></svg></span> Story&nbsp;Editor</a>
    <nav class="nav" aria-label="主导航">
      <a href="home-discover.html">发现</a><a href="my-space.html" aria-current="page">我的空间</a><a href="community.html">社区</a>
    </nav>
    <div class="sp">
      <a class="btn primary sm" href="create-editor.html"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg> 创作</a>
      <a class="avatar" style="background:linear-gradient(135deg,#f59e0b,#e11d48)" href="settings.html" aria-label="账户设置"></a>
    </div>
  </div>
</header>

<div class="wrap">
  <h1 class="sr-only">我的空间</h1>
  <section class="profile">
    <span class="pic" aria-hidden="true"></span>
    <div class="who">
      <h1 style="font-size:22px">深蓝拾音</h1>
      <p>写末世与孤独的人 · 相信每个选择都有回声</p>
    </div>
    <div class="nums">
      <div><b>4</b><span>作品</span></div>
      <div><b>3.4万</b><span>被游玩</span></div>
      <div><b>2942</b><span>获赞</span></div>
    </div>
    <a class="btn secondary sm edit" href="settings.html">编辑资料</a>
  </section>

  <div class="tabs" role="tablist" aria-label="我的空间">
    <button role="tab" aria-selected="true" data-tab="works">我的创作<span class="c" id="cWorks"></span></button>
    <button role="tab" aria-selected="false" data-tab="reading">我在读<span class="c" id="cRead"></span></button>
  </div>

  <section class="panel on" data-panel="works" aria-label="我的创作">
    <div class="works" id="worksGrid"></div>
  </section>

  <section class="panel" data-panel="reading" aria-label="我在读">
    <div class="saves" id="savesList"></div>
  </section>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
  const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
  let works=[
    {id:'w1',title:'最后的深夜电台',k:'末世·电台',g:['#1a1c2b','#0e1730'],acc:'#7fc4f2',status:'pub',plays:'2.4万',likes:1284,upd:'3 天前'},
    {id:'w2',title:'信号塔的最后一班岗',k:'末世·续作',g:['#0a0f1e','#123047'],acc:'#7fc4f2',status:'draft',plays:'—',likes:0,upd:'昨天'},
    {id:'w3',title:'她说她来自明天',k:'软科幻·言情',g:['#111827','#312e81'],acc:'#a5b4fc',status:'pub',plays:'9860',likes:1042,upd:'上周'},
    {id:'w4',title:'未命名故事',k:'尚未设定',g:['#1c1c22','#2a2a33'],acc:'#c9ced8',status:'draft',plays:'—',likes:0,upd:'5 分钟前'},
  ];
  let saves=[
    {id:'s1',title:'戏楼夜半开锣',g:['#3b0a12','#7f1d1d'],prog:'第二夜 · 锣声未歇 · 12 节点',last:'3 天前'},
    {id:'s2',title:'把太阳寄给你',g:['#4a1d3f','#be185d'],prog:'序章 · 末班星舰 · 3 节点',last:'昨天'},
    {id:'s3',title:'雪满刀锋',g:['#0b1a1a','#134e4a'],prog:'第一章 · 出关 · 7 节点',last:'刚刚'},
  ];

  const worksGrid=$('#worksGrid'),savesList=$('#savesList');
  function renderWorks(){
    $('#cWorks').textContent=works.length;
    worksGrid.innerHTML=works.map(w=>`<article class="work" data-id="${w.id}">
      <div class="cov" style="background:linear-gradient(150deg,${w.g[0]},${w.g[1]})"><span class="k" style="color:${w.acc}">${w.k}</span><span class="ct">${w.title}</span></div>
      <div class="info">
        <div class="trow"><h3>${w.title}</h3><span class="badge ${w.status==='pub'?'pub':'draft'}">${w.status==='pub'?'已发布':'草稿'}</span></div>
        <div class="meta">${w.status==='pub'?`${w.plays} 游玩 · ${w.likes} 赞 · 更新于 ${w.upd}`:`草稿 · 编辑于 ${w.upd}`}</div>
        <div class="acts">
          <a class="btn secondary sm" href="create-editor.html">编辑</a>
          ${w.status==='pub'
            ? `<a class="btn ghost sm" href="story-detail.html">查看</a><button class="btn ghost sm" type="button" data-unpub="${w.id}">下架</button>`
            : `<button class="btn accent sm" type="button" data-pub="${w.id}">发布</button>`}
        </div>
      </div>
    </article>`).join('')
      +`<button class="newwork" type="button" onclick="location.href='create-editor.html'"><span class="plus" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg></span>新建作品</button>`;
  }
  function renderSaves(){
    $('#cRead').textContent=saves.length;
    if(!saves.length){savesList.innerHTML=`<div class="empty" role="status"><div class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></div><h3>还没有在读的故事</h3><p>去书库挑一个世界走进去,进度会自动存在这里,随时续玩。</p><a class="btn primary sm" href="home-discover.html">去书库逛逛</a></div>`;return;}
    savesList.innerHTML=saves.map(s=>`<div class="save" data-id="${s.id}">
      <span class="cov" style="background:linear-gradient(150deg,${s.g[0]},${s.g[1]})" aria-hidden="true"></span>
      <div class="info"><h3>${s.title}</h3><div class="prog">${s.prog} · 上次 ${s.last}</div></div>
      <div class="acts" data-acts="${s.id}">
        <a class="btn accent sm" href="play-reading.html">续玩</a>
        <button class="btn danger sm" type="button" data-del="${s.id}">删除存档</button>
      </div>
    </div>`).join('');
  }

  document.addEventListener('click',e=>{
    const pub=e.target.closest('[data-pub]'),unpub=e.target.closest('[data-unpub]'),del=e.target.closest('[data-del]');
    if(pub){const w=works.find(x=>x.id===pub.dataset.pub);w.status='pub';w.plays='0';w.upd='刚刚';renderWorks();toast('已发布《'+w.title+'》,现在出现在书库');return;}
    if(unpub){const w=works.find(x=>x.id===unpub.dataset.unpub);w.status='draft';w.upd='刚刚';renderWorks();toast('已下架《'+w.title+'》,转为草稿');return;}
    if(del){ // 行内二次确认
      const box=e.target.closest('[data-acts]');
      box.innerHTML=`<span class="confirm">删除后进度不可恢复</span><button class="btn ghost sm" type="button" data-cancel="${del.dataset.del}">取消</button><button class="btn danger sm" type="button" data-yes="${del.dataset.del}">确认删除</button>`;
      return;
    }
    const cancel=e.target.closest('[data-cancel]'),yes=e.target.closest('[data-yes]');
    if(cancel){renderSaves();return;}
    if(yes){const t=saves.find(x=>x.id===yes.dataset.yes);saves=saves.filter(x=>x.id!==yes.dataset.yes);renderSaves();toast('已删除《'+t.title+'》的存档');return;}
  });

  $$('.tabs button').forEach(b=>b.addEventListener('click',()=>{
    $$('.tabs button').forEach(x=>x.setAttribute('aria-selected',String(x===b)));
    $$('.panel').forEach(p=>p.classList.toggle('on',p.dataset.panel===b.dataset.tab));
  }));

  let tt;function toast(m){const el=$('#toast');el.textContent=m;el.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('on'),2200);}
  // 支持 #reading 直达
  if(location.hash==='#reading'){$('.tabs button[data-tab="reading"]').click();}
  renderWorks();renderSaves();
</script>
</body>
</html>
