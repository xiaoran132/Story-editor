<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Story Editor · 自由创作的 AI 互动剧情社区。挑一个世界走进去,或亲手写一个——AI 陪你把它讲完。" />
<title>发现 · Story Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;510;590;700&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff; --page:#ffffff; --fg:#111111; --muted:#5b626e; --surface:#f7f8fa;
    --border:#e7e9ef; --accent:#1677ff; --radius:14px;
    --ring:0 0 0 3px rgba(22,119,255,.35);
    --sans:"Inter",system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;
    --serif:"Noto Serif SC",Georgia,"Songti SC",serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{color:var(--fg);font-family:var(--sans);-webkit-font-smoothing:antialiased;background-color:var(--bg)}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  :focus-visible{outline:none;box-shadow:var(--ring);border-radius:8px}
  a{color:inherit}

  /* ---------- 冷静外壳:导航 ---------- */
  header.nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.82);
    backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--border)}
  .nav-inner{max-width:1280px;margin:0 auto;padding:0 24px;height:60px;display:flex;align-items:center;gap:20px}
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;letter-spacing:-.01em;text-decoration:none;flex:none}
  .brand .glyph{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:#fff;
    background:var(--fg)}
  .nav-links{display:flex;gap:4px;margin-left:6px}
  .nav-links a{padding:7px 12px;border-radius:8px;color:var(--muted);text-decoration:none;font-size:14px;font-weight:510;letter-spacing:.01em;transition:.15s}
  .nav-links a[aria-current="page"],.nav-links a:hover{color:var(--fg);background:var(--surface)}
  .search{margin-left:auto;position:relative;display:flex;align-items:center}
  .search input{width:260px;height:38px;border:1px solid var(--border);border-radius:10px;background:var(--surface);
    padding:0 12px 0 34px;font-size:13.5px;color:var(--fg);font-family:var(--sans);outline:none;transition:.15s}
  .search input:focus{border-color:var(--accent);background:#fff;box-shadow:var(--ring)}
  .search .ico{position:absolute;left:11px;color:var(--muted);pointer-events:none;display:flex}
  .btn-create{height:38px;padding:0 16px;border:0;border-radius:10px;background:var(--fg);color:#fff;flex:none;
    font-size:13.5px;font-weight:590;letter-spacing:.01em;cursor:pointer;display:flex;align-items:center;gap:6px;transition:.15s}
  .btn-create:hover{background:#000}
  .btn-create:active{transform:translateY(1px)}
  .avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#6d28d9,#e11d48);flex:none;
    border:0;cursor:pointer;padding:0}

  /* ---------- Hero ---------- */
  .hero{max-width:1280px;margin:0 auto;padding:54px 24px 8px}
  .eyebrow{display:inline-flex;align-items:center;gap:9px;font-size:12px;font-weight:590;letter-spacing:.14em;
    color:var(--muted);margin-bottom:16px}
  .eyebrow::before{content:"";width:20px;height:1.5px;background:var(--accent);border-radius:2px}
  .hero h1{font-family:var(--serif);font-weight:900;font-size:clamp(29px,4.4vw,44px);line-height:1.32;letter-spacing:0}
  .hero h1 .em{background:linear-gradient(100deg,#1677ff,#6d28d9 40%,#e11d48 75%,#f59e0b);background-size:220% 100%;
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:flow 9s ease-in-out infinite}
  .hero p{margin-top:14px;color:var(--muted);font-size:15.5px;line-height:1.7;max-width:560px}
  .toolbar{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-top:24px}
  .filters{display:flex;gap:8px;flex-wrap:wrap;flex:1;min-width:0}
  .chip{padding:7px 14px;border:1px solid var(--border);border-radius:999px;background:#fff;font-size:13px;
    color:#374151;cursor:pointer;font-weight:510;letter-spacing:.01em;transition:.15s;font-family:var(--sans)}
  .chip:hover{border-color:#c7ccd6}
  .chip[aria-pressed="true"]{background:var(--fg);color:#fff;border-color:var(--fg)}
  .statepick{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
  .statepick .seg{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:2px}
  .statepick button{border:0;background:transparent;color:var(--muted);font-size:12px;padding:5px 9px;border-radius:6px;
    cursor:pointer;font-family:var(--sans);letter-spacing:.01em}
  .statepick button[aria-pressed="true"]{background:#fff;color:var(--fg);font-weight:590;box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .resultbar{max-width:1280px;margin:20px auto 0;padding:0 24px;color:var(--muted);font-size:13px;letter-spacing:.01em}

  /* ---------- 错落墙 ---------- */
  .wall{max-width:1280px;margin:8px auto 80px;padding:16px 24px;column-count:4;column-gap:20px}
  @media(max-width:1080px){.wall{column-count:3}}
  @media(max-width:760px){.wall{column-count:2}.search input{width:150px}.nav-links{display:none}}
  @media(max-width:460px){.wall{column-count:1}}

  .card{display:block;break-inside:avoid;margin-bottom:20px;border-radius:var(--radius);overflow:hidden;cursor:pointer;
    border:1px solid var(--border);background:var(--bg);position:relative;text-decoration:none;color:inherit;
    box-shadow:0 1px 2px rgba(17,17,17,.04), 0 10px 28px -20px rgba(17,17,17,.22);
    transition:transform .18s ease, box-shadow .18s ease}
  .card:hover{transform:translateY(-4px);box-shadow:0 20px 44px -18px rgba(17,17,17,.32)}
  .card:active{transform:translateY(-1px)}
  .cover{position:relative;padding:18px 18px 22px;color:#fff;overflow:hidden}
  .cover::after{content:"";position:absolute;inset:0;background:
    radial-gradient(120% 80% at 80% 0%,rgba(255,255,255,.22),transparent 60%);pointer-events:none}
  .kicker{font-size:11px;font-weight:700;letter-spacing:.14em;opacity:.9}
  .cover h3{font-family:var(--serif);font-weight:900;line-height:1.3;margin-top:10px;text-shadow:0 1px 12px rgba(0,0,0,.28)}
  .cover .excerpt{margin-top:10px;font-size:12.5px;line-height:1.7;opacity:.92;font-family:var(--serif)}
  .cover .badge{position:absolute;top:14px;right:14px;font-size:11px;font-weight:590;letter-spacing:.02em;
    background:rgba(0,0,0,.34);backdrop-filter:blur(4px);padding:4px 9px;border-radius:999px}
  .meta{padding:12px 16px 14px;display:flex;align-items:center;gap:10px}
  .meta .au{width:22px;height:22px;border-radius:50%;flex:none}
  .meta .who{font-size:12.5px;color:#374151;font-weight:510}
  .meta .stat{margin-left:auto;display:flex;gap:12px;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
  .tags{padding:0 16px 14px;display:flex;flex-wrap:wrap;gap:6px}
  .tag{font-size:11px;padding:3px 8px;border-radius:6px;background:var(--surface);color:#4b5563;font-weight:510;letter-spacing:.01em}
  .cover.lg h3{font-size:23px}.cover.lg{padding-bottom:30px}
  .cover.md h3{font-size:19px}
  .cover.sm h3{font-size:17px}

  /* ---------- 加载骨架 ---------- */
  .sk{break-inside:avoid;margin-bottom:20px;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:#fff}
  .sk .shimmer{background:linear-gradient(100deg,#eef0f4 30%,#f6f7f9 50%,#eef0f4 70%);background-size:200% 100%;
    animation:sh 1.3s linear infinite}
  .sk .c{height:120px}.sk.lg .c{height:170px}.sk.sm .c{height:96px}
  .sk .l{height:12px;border-radius:6px;margin:14px 16px 0}
  .sk .l.s{width:40%;margin-bottom:16px}
  @keyframes sh{to{background-position:-200% 0}}

  /* ---------- 空 / 错误态 ---------- */
  .state{max-width:640px;margin:40px auto 90px;padding:48px 24px;text-align:center}
  .state .ic{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;margin:0 auto 18px;
    background:var(--surface);color:var(--muted)}
  .state h2{font-family:var(--serif);font-size:20px;font-weight:700;line-height:1.4;margin-bottom:8px}
  .state p{color:var(--muted);font-size:14px;line-height:1.7;margin-bottom:22px}
  .state .act{display:inline-flex;gap:10px}
  .btn{height:40px;padding:0 18px;border-radius:10px;font-size:14px;font-weight:590;cursor:pointer;border:1px solid var(--border);
    background:#fff;color:var(--fg);display:inline-flex;align-items:center;gap:7px;transition:.15s;font-family:var(--sans)}
  .btn:hover{border-color:#c7ccd6}
  .btn.primary{background:var(--fg);color:#fff;border-color:var(--fg)}
  .btn.primary:hover{background:#000}
  .foot{max-width:1280px;margin:0 auto;padding:0 24px 60px;color:var(--muted);font-size:12.5px;text-align:center}

  /* ---------- 动效:外壳静止,动感全在作品卡上(各借自身主题色) ---------- */
  .cover::after{transition:background .25s ease}
  .card:hover .cover::after{background:radial-gradient(120% 95% at 80% 0%,rgba(255,255,255,.36),transparent 62%)}
  .cover .cta{display:inline-flex;align-items:center;gap:5px;margin-top:13px;font-family:var(--sans);font-size:12px;
    font-weight:590;letter-spacing:.02em;color:#fff;opacity:0;transform:translateY(6px);
    transition:opacity .2s ease,transform .2s ease}
  .card:hover .cta{opacity:1;transform:none}
  .card.reveal{opacity:0}
  .card.reveal.in{animation:rise .5s cubic-bezier(.2,0,0,1) both;animation-delay:var(--d,0ms)}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes drift{0%,100%{background-position:50% 0%}50%{background-position:50% 100%}}
  @keyframes flow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

  @media (prefers-reduced-motion: reduce){
    *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
    .card:hover{transform:none}
  }
</style>
</head>
<body>
<header class="nav">
  <div class="nav-inner">
    <a class="brand" href="#" aria-label="Story Editor 首页"><span class="glyph" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19.5v-6M12 13.5 7.7 8.9M12 13.5l4.3-4.6"/><circle cx="12" cy="20" r="1.4" fill="#fff" stroke="none"/><circle cx="7.4" cy="8.3" r="2.3" fill="#1677ff" stroke="none"/><circle cx="16.6" cy="8.3" r="2.3" fill="#fff" stroke="none"/></svg></span> Story&nbsp;Editor</a>
    <nav class="nav-links" aria-label="主导航">
      <a href="#" aria-current="page">发现</a>
      <a href="my-space.html#reading">我在读</a>
      <a href="my-space.html">我的创作</a>
      <a href="community.html">社区</a>
    </nav>
    <div class="search" role="search">
      <label class="sr-only" for="q">搜索作品</label>
      <span class="ico" aria-hidden="true"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></span>
      <input id="q" type="search" placeholder="搜索世界观、作者、标签…" autocomplete="off" />
    </div>
    <button class="btn-create" type="button">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      创作
    </button>
    <button class="avatar" type="button" aria-label="我的账户"></button>
  </div>
</header>

<section class="hero">
  <p class="eyebrow">自由创作 · AI 共创</p>
  <h1>在这里，剧情有<span class="em">无穷种</span>可能</h1>
  <p>每个人都是玩家，也是创作者。挑一个世界走进去，或者亲手写一个——AI 陪你把它讲完。</p>
  <div class="toolbar">
    <div class="filters" role="group" aria-label="题材筛选">
      <button class="chip" type="button" data-cat="全部" aria-pressed="true">全部</button>
      <button class="chip" type="button" data-cat="恐怖惊悚" aria-pressed="false">恐怖惊悚</button>
      <button class="chip" type="button" data-cat="言情" aria-pressed="false">言情</button>
      <button class="chip" type="button" data-cat="科幻" aria-pressed="false">科幻</button>
      <button class="chip" type="button" data-cat="武侠仙侠" aria-pressed="false">武侠仙侠</button>
      <button class="chip" type="button" data-cat="悬疑推理" aria-pressed="false">悬疑推理</button>
      <button class="chip" type="button" data-cat="治愈日常" aria-pressed="false">治愈日常</button>
      <button class="chip" type="button" data-cat="末世生存" aria-pressed="false">末世生存</button>
    </div>
    <div class="statepick" aria-label="状态预览(演示用)">
      <span>状态预览</span>
      <div class="seg" role="group" aria-label="预览页面状态">
        <button type="button" data-state="ready" aria-pressed="true">正常</button>
        <button type="button" data-state="loading" aria-pressed="false">加载</button>
        <button type="button" data-state="empty" aria-pressed="false">空</button>
        <button type="button" data-state="error" aria-pressed="false">错误</button>
      </div>
    </div>
  </div>
</section>

<p class="resultbar" id="resultbar" aria-live="polite"></p>
<main class="wall" id="wall" aria-busy="false"></main>

<div class="foot">Story Editor · 自由创作的 AI 互动剧情社区 &nbsp;·&nbsp; 样张 · 发现页</div>

<script>
const works = [
  {kicker:"末世·电台",title:"最后的深夜电台",ex:"电流杂音里，有人在呼救。你是否回应？",au:"#f59e0b",who:"深蓝拾音",g:["#1a1c2b","#0e1730"],accent:"#7fc4f2",tags:["末世生存","悬疑","硬核"],plays:"2.4万",size:"lg",hidden:1,cat:"末世生存"},
  {kicker:"民国·怪谈",title:"戏楼夜半开锣",ex:"戏还没散，台下的人却一个都没走。",au:"#e11d48",who:"三更",g:["#3b0a12","#7f1d1d"],accent:"#fca5a5",tags:["恐怖惊悚","民国"],plays:"1.1万",size:"md",hidden:1,cat:"恐怖惊悚"},
  {kicker:"星海·软科幻",title:"把太阳寄给你",ex:"末班星舰起航前，我想把一整个夏天寄出去。",au:"#6d28d9",who:"Kuro",g:["#111827","#312e81"],accent:"#a5b4fc",tags:["科幻","言情","治愈"],plays:"8632",size:"md",cat:"科幻"},
  {kicker:"江湖·武侠",title:"雪满刀锋",ex:"你握刀的手在抖——是冷，还是怕？",au:"#0f766e",who:"停云",g:["#0b1a1a","#134e4a"],accent:"#5eead4",tags:["武侠","权谋"],plays:"1.9万",size:"sm",cat:"武侠仙侠"},
  {kicker:"校园·恋爱",title:"樱花落下的速度",ex:"每秒五厘米，而你走得比这更慢。",au:"#db2777",who:"晴子",g:["#4a1d3f","#be185d"],accent:"#fbcfe8",tags:["言情","校园","治愈"],plays:"3.7万",size:"lg",cat:"言情"},
  {kicker:"赛博·黑客",title:"霓虹不眠",ex:"这座城市把你的记忆卖了个好价钱。",au:"#0891b2",who:"NULL",g:["#0a0f1e","#7c1d6f"],accent:"#e879f9",tags:["赛博朋克","悬疑"],plays:"6210",size:"md",cat:"科幻"},
  {kicker:"仙侠·飞升",title:"斩却三千烦恼",ex:"渡劫这一步，你打算带着谁一起？",au:"#ca8a04",who:"青崖",g:["#1c1917","#4d3a10"],accent:"#fde68a",tags:["仙侠","修真"],plays:"5.2万",size:"sm",cat:"武侠仙侠"},
  {kicker:"温情·日常",title:"街角面包店的第七年",ex:"今天也有人推门进来，说「和往常一样」。",au:"#65a30d",who:"面粉",g:["#1a2417","#3f6212"],accent:"#bef264",tags:["治愈日常","慢生活"],plays:"9014",size:"md",cat:"治愈日常"},
  {kicker:"悬疑·本格",title:"第十三位客人",ex:"名单上只有十二个人，可餐桌坐满了十三个。",au:"#475569",who:"灰",g:["#0f172a","#334155"],accent:"#cbd5e1",tags:["悬疑推理","密室"],plays:"1.4万",size:"sm",cat:"悬疑推理"},
  {kicker:"废土·机械",title:"锈海行舟",ex:"引擎还剩最后一格油，前方是海市蜃楼。",au:"#c2410c",who:"齿轮",g:["#1c1310","#7c2d12"],accent:"#fdba74",tags:["末世生存","机械"],plays:"7788",size:"md",cat:"末世生存"},
];

const wall=document.getElementById('wall'), resultbar=document.getElementById('resultbar');
const playIco=s=>`<span aria-hidden="true"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" style="vertical-align:-2px"><path d="M8 5v14l11-7z"/></svg></span> <span class="count" data-v="${s}" aria-label="游玩 ${s} 次">${s}</span>`;
const likeIco=`<span aria-hidden="true"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 1 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg></span>`;

let cat="全部", query="", state="ready";

function cardHTML(w,i){
  return `<a class="card" href="story-detail.html" style="--d:${Math.min(i,7)*55}ms" aria-label="${w.title}，作者 ${w.who}，题材 ${w.cat}">
    <div class="cover ${w.size}" style="background:linear-gradient(155deg,${w.g[0]},${w.g[1]} 55%,${w.g[0]});background-size:100% 230%;animation:drift 16s ease-in-out infinite;animation-delay:${(-i*1.7).toFixed(1)}s">
      <div class="badge" style="color:${w.accent}">${w.hidden?'含隐藏属性':'AI 生成'}</div>
      <div class="kicker" style="color:${w.accent}">${w.kicker}</div>
      <h3>${w.title}</h3>
      <div class="excerpt">${w.ex}</div>
      <span class="cta">开始阅读 →</span>
    </div>
    <div class="meta">
      <span class="au" style="background:${w.au}" aria-hidden="true"></span>
      <span class="who">${w.who}</span>
      <span class="stat"><span>${playIco(w.plays)}</span><span>${likeIco} 收藏</span></span>
    </div>
    <div class="tags">${w.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
  </a>`;
}
function skeleton(){
  const sizes=['lg','md','sm','md','md','sm','lg','md'];
  wall.style.columnCount='';
  wall.innerHTML=sizes.map(s=>`<div class="sk ${s}" aria-hidden="true"><div class="c shimmer"></div><div class="l shimmer"></div><div class="l s shimmer"></div></div>`).join('');
}
function stateBlock(kind){
  wall.style.columnCount='1';
  if(kind==='empty'){
    wall.innerHTML=`<section class="state" role="status">
      <div class="ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></div>
      <h2>没有找到匹配的作品</h2>
      <p>换个题材，或清空搜索词试试。也可以由你来写下这个世界的第一行。</p>
      <div class="act">
        <button class="btn" type="button" onclick="resetFilters()">清空筛选</button>
        <button class="btn primary" type="button">去创作</button>
      </div>
    </section>`;
  }else{
    wall.innerHTML=`<section class="state" role="alert">
      <div class="ic" style="color:#b4232f;background:#fdecee"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 9v4M12 17h.01M10.3 3.9 2 18a2 2 0 0 0 1.7 3h16.6A2 2 0 0 0 22 18L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg></div>
      <h2>没能加载出作品列表</h2>
      <p>可能是网络波动或服务暂时不可用。稍等片刻，再试一次。</p>
      <div class="act"><button class="btn primary" type="button" onclick="setState('ready')">重试</button></div>
    </section>`;
  }
}
function filtered(){
  return works.filter(w=>(cat==='全部'||w.cat===cat) &&
    (!query || (w.title+w.who+w.tags.join('')+w.ex).toLowerCase().includes(query.toLowerCase())));
}
function render(){
  if(state==='loading'){wall.setAttribute('aria-busy','true');skeleton();resultbar.textContent='正在加载…';return;}
  wall.setAttribute('aria-busy','false');
  if(state==='error'){stateBlock('error');resultbar.textContent='';return;}
  const list=filtered();
  if(state==='empty'||list.length===0){stateBlock('empty');resultbar.textContent='共 0 部作品';return;}
  wall.style.columnCount='';
  wall.innerHTML=list.map(cardHTML).join('');
  resultbar.textContent=`共 ${list.length} 部作品${cat!=='全部'?` · ${cat}`:''}`;
  applyMotion();
}

// —— 动效编排:入场错落 + 数字 count-up(reduced-motion 下全部跳过) ——
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
function animateCount(el){
  if(RM)return; const raw=el.dataset.v, wan=raw.includes('万'), num=parseFloat(raw);
  if(isNaN(num))return; const dur=900, t0=performance.now();
  (function tick(t){const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3);
    el.textContent = wan ? (num*e).toFixed(1)+'万' : Math.round(num*e).toLocaleString('en-US');
    if(p<1)requestAnimationFrame(tick); else el.textContent=raw;})(t0);
}
function applyMotion(){
  const cards=[...wall.querySelectorAll('.card')];
  if(RM){cards.forEach(c=>c.querySelectorAll('.count').forEach(x=>x.textContent=x.dataset.v));return;}
  cards.forEach(c=>c.classList.add('reveal'));
  const io=new IntersectionObserver((es,obs)=>{es.forEach(e=>{if(e.isIntersecting){
    e.target.classList.add('in');
    e.target.querySelectorAll('.count').forEach(animateCount);
    e.target.addEventListener('animationend',()=>e.target.classList.remove('reveal','in'),{once:true});
    obs.unobserve(e.target);
  }});},{rootMargin:'0px 0px -6% 0px'});
  cards.forEach(c=>io.observe(c));
}
function setState(s){
  state=s;
  document.querySelectorAll('.statepick button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.state===s)));
  if(s==='loading'){render();setTimeout(()=>{state='ready';render();},900);}else render();
}
function resetFilters(){
  cat='全部';query='';document.getElementById('q').value='';
  document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',String(c.dataset.cat==='全部')));
  setState('ready');
}

document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{
  document.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed','false'));
  c.setAttribute('aria-pressed','true');cat=c.dataset.cat;state='ready';
  document.querySelector('.statepick button[data-state="ready"]').click();
}));
document.querySelectorAll('.statepick button').forEach(b=>b.addEventListener('click',()=>setState(b.dataset.state)));
document.getElementById('q').addEventListener('input',e=>{query=e.target.value.trim();state='ready';
  document.querySelectorAll('.statepick button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.state==='ready')));render();});

// 首屏:先骨架,后加载(演示真实加载态)
setState('loading');
</script>
