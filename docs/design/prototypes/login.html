<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="登录 Story Editor · 自由创作的 AI 互动剧情社区。未登录也能先玩。" />
<title>登录 · Story Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;510;590;700&family=Noto+Serif+SC:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff; --surface:#f7f8fa; --fg:#111111; --muted:#5b626e; --border:#e7e9ef;
    --accent:#1677ff; --accent-ink:#0b5fd0; --danger:#b4232f; --gold:#e3bd7d;
    --r-sm:8px; --r-md:10px; --r-lg:14px; --ring:0 0 0 3px rgba(22,119,255,.35); --ease:cubic-bezier(.2,0,0,1);
    --sans:"Inter",system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;
    --serif:"Noto Serif SC",Georgia,"Songti SC",serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;background:var(--bg);color:var(--fg);font-family:var(--sans);-webkit-font-smoothing:antialiased;line-height:1.5}
  :focus-visible{outline:none;box-shadow:var(--ring);border-radius:var(--r-sm)}
  button{font-family:inherit;cursor:pointer}a{color:inherit}

  .split{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr}
  @media(max-width:820px){.split{grid-template-columns:1fr}}

  /* 左:暗色氛围(阅读态门口) */
  .aside{position:relative;overflow:hidden;color:#f4ece0;padding:48px 52px;display:flex;flex-direction:column;
    background-color:#0a0e18;
    background-image:radial-gradient(58% 42% at 74% 16%,rgba(120,150,220,.24),transparent 60%),
      radial-gradient(50% 34% at 12% 96%,rgba(94,234,212,.10),transparent 66%),
      linear-gradient(160deg,#0b1020,#141a2e 55%,#241826)}
  .aside::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.06;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='150' height='150'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.82' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='150' height='150' filter='url(%23n)'/></svg>")}
  .aside .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;position:relative;z-index:1}
  .aside .brand .g{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12)}
  .aside .mid{margin-top:auto;position:relative;z-index:1}
  .aside .kick{font-size:12px;letter-spacing:.24em;color:var(--gold);font-weight:590;margin-bottom:16px}
  .aside h1{font-family:var(--serif);font-weight:900;font-size:clamp(30px,3.6vw,42px);line-height:1.34}
  .aside p{margin-top:18px;font-family:var(--serif);font-size:15px;line-height:1.9;color:#cfc6b6;max-width:38ch}
  .aside .foot{margin-top:26px;font-size:12.5px;color:#9c9483;letter-spacing:.01em;position:relative;z-index:1}
  @media(max-width:820px){.aside{padding:34px 28px 30px}.aside .mid{margin-top:26px}.aside p{display:none}}

  /* 右:表单 */
  .main{display:flex;align-items:center;justify-content:center;padding:40px 28px}
  .box{width:100%;max-width:380px}
  .tabs{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:3px;margin-bottom:24px}
  .tabs button{flex:1;height:38px;border:0;background:transparent;color:var(--muted);font-size:14px;font-weight:510;border-radius:7px;letter-spacing:.01em}
  .tabs button[aria-selected="true"]{background:var(--bg);color:var(--fg);font-weight:590;box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .form{display:none}.form.on{display:block;animation:fade .25s var(--ease)}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h2{font-family:var(--serif);font-size:24px;font-weight:700;margin-bottom:6px}
  .lead{color:var(--muted);font-size:13.5px;margin-bottom:22px}
  .fld{margin-bottom:16px}
  .fld label{display:block;font-size:13px;font-weight:510;margin-bottom:7px}
  .inp{width:100%;height:44px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--bg);color:var(--fg);
    font-size:14px;padding:0 12px;outline:none;transition:border-color .15s,box-shadow .15s;font-family:var(--sans)}
  .inp:focus{border-color:var(--accent);box-shadow:var(--ring)}
  .fld.err .inp{border-color:var(--danger)}
  .pwwrap{position:relative}
  .pwwrap .inp{padding-right:44px}
  .peek{position:absolute;right:6px;top:6px;width:32px;height:32px;border:0;background:transparent;color:var(--muted);border-radius:7px;display:grid;place-items:center}
  .peek:hover{background:var(--surface);color:var(--fg)}
  .emsg{font-size:12px;color:var(--danger);margin-top:6px;display:none;align-items:center;gap:5px}
  .fld.err .emsg{display:flex}
  .rowline{display:flex;align-items:center;justify-content:space-between;margin:6px 0 20px;font-size:13px}
  .rowline label{display:inline-flex;align-items:center;gap:7px;color:var(--muted);cursor:pointer}
  .rowline a{color:var(--accent-ink);text-decoration:none;font-weight:510}
  .rowline a:hover{text-decoration:underline}
  .agree{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;color:var(--muted);line-height:1.6;margin:4px 0 20px}
  .agree a{color:var(--accent-ink)}
  .btn{width:100%;height:46px;border:0;border-radius:var(--r-md);font-size:15px;font-weight:590;letter-spacing:.01em;
    display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .15s var(--ease),transform .09s}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--fg);color:#fff}.btn.primary:hover{background:#000}
  .btn[disabled]{opacity:.6;pointer-events:none}
  .divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;margin:20px 0;letter-spacing:.04em}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border)}
  .btn.ghost{width:100%;height:46px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r-md);color:var(--fg);
    font-size:14.5px;font-weight:590;display:inline-flex;align-items:center;justify-content:center;gap:8px}
  .btn.ghost:hover{border-color:#c7ccd6;background:var(--surface)}
  .spin{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .8s linear infinite;display:inline-block}
  @keyframes spin{to{transform:rotate(360deg)}}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);z-index:70;background:var(--fg);color:#fff;
    padding:11px 18px;border-radius:var(--r-md);font-size:13px;opacity:0;transition:.25s var(--ease);pointer-events:none}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="split">
  <!-- 左:氛围 -->
  <aside class="aside">
    <a class="brand" href="home-discover.html"><span class="g" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f4ece0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19.5v-6M12 13.5 7.7 8.9M12 13.5l4.3-4.6"/><circle cx="12" cy="20" r="1.4" fill="#f4ece0" stroke="none"/><circle cx="7.4" cy="8.3" r="2.3" fill="#e3bd7d" stroke="none"/><circle cx="16.6" cy="8.3" r="2.3" fill="#f4ece0" stroke="none"/></svg></span> Story&nbsp;Editor</a>
    <div class="mid">
      <div class="kick">走进一个世界</div>
      <h1>每个选择,<br>都有回声。</h1>
      <p>登录后,你的存档、创作与关注会跨设备同步。还没准备好?也可以先以匿名身份走进任意一个故事。</p>
    </div>
    <div class="foot">© Story Editor · 自由创作的 AI 互动剧情社区</div>
  </aside>

  <!-- 右:表单 -->
  <main class="main">
    <div class="box">
      <div class="tabs" role="tablist" aria-label="登录或注册">
        <button role="tab" id="tab-login" aria-selected="true" data-f="login">登录</button>
        <button role="tab" id="tab-reg" aria-selected="false" data-f="reg">注册</button>
      </div>

      <!-- 登录 -->
      <form class="form on" data-panel="login" novalidate aria-labelledby="tab-login">
        <h2>欢迎回来</h2>
        <p class="lead">继续你未讲完的故事。</p>
        <div class="fld" id="l-em-fld">
          <label for="l-em">邮箱</label>
          <input class="inp" id="l-em" type="email" autocomplete="email" placeholder="you@example.com" aria-describedby="l-em-msg" />
          <span class="emsg" id="l-em-msg" role="alert"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>请输入有效的邮箱</span>
        </div>
        <div class="fld" id="l-pw-fld">
          <label for="l-pw">密码</label>
          <div class="pwwrap">
            <input class="inp" id="l-pw" type="password" autocomplete="current-password" placeholder="••••••••" aria-describedby="l-pw-msg" />
            <button class="peek" type="button" aria-label="显示密码" aria-pressed="false" data-peek="l-pw"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg></button>
          </div>
          <span class="emsg" id="l-pw-msg" role="alert"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>请输入密码</span>
        </div>
        <div class="rowline">
          <label><input type="checkbox" checked /> 记住我</label>
          <a href="#" onclick="toast('重置链接已发送到邮箱(演示)');return false;">忘记密码?</a>
        </div>
        <button class="btn primary" type="submit" id="l-submit">登录</button>
        <div class="divider">或</div>
        <a class="btn ghost" href="home-discover.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg> 先以匿名身份进入</a>
      </form>

      <!-- 注册 -->
      <form class="form" data-panel="reg" novalidate aria-labelledby="tab-reg">
        <h2>创建账号</h2>
        <p class="lead">一分钟,开始读或写你的第一个故事。</p>
        <div class="fld" id="r-nk-fld">
          <label for="r-nk">昵称</label>
          <input class="inp" id="r-nk" autocomplete="nickname" placeholder="别人会这样称呼你" aria-describedby="r-nk-msg" />
          <span class="emsg" id="r-nk-msg" role="alert"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>请填写昵称</span>
        </div>
        <div class="fld" id="r-em-fld">
          <label for="r-em">邮箱</label>
          <input class="inp" id="r-em" type="email" autocomplete="email" placeholder="you@example.com" aria-describedby="r-em-msg" />
          <span class="emsg" id="r-em-msg" role="alert"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>请输入有效的邮箱</span>
        </div>
        <div class="fld" id="r-pw-fld">
          <label for="r-pw">密码</label>
          <div class="pwwrap">
            <input class="inp" id="r-pw" type="password" autocomplete="new-password" placeholder="至少 8 位" aria-describedby="r-pw-msg" />
            <button class="peek" type="button" aria-label="显示密码" aria-pressed="false" data-peek="r-pw"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg></button>
          </div>
          <span class="emsg" id="r-pw-msg" role="alert"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>密码至少 8 位</span>
        </div>
        <label class="agree"><input type="checkbox" id="r-agree" style="margin-top:2px" /> <span>我已阅读并同意 <a href="#">服务条款</a> 与 <a href="#">隐私政策</a>。</span></label>
        <button class="btn primary" type="submit" id="r-submit">创建账号</button>
      </form>
    </div>
  </main>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
  const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
  const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
  // tabs
  $$('.tabs button').forEach(b=>b.addEventListener('click',()=>{
    $$('.tabs button').forEach(x=>x.setAttribute('aria-selected',String(x===b)));
    $$('.form').forEach(f=>f.classList.toggle('on',f.dataset.panel===b.dataset.f));
  }));
  // 显隐密码
  $$('[data-peek]').forEach(btn=>btn.addEventListener('click',()=>{
    const inp=$('#'+btn.dataset.peek),show=inp.type==='password';inp.type=show?'text':'password';
    btn.setAttribute('aria-pressed',String(show));btn.setAttribute('aria-label',show?'隐藏密码':'显示密码');
  }));
  const emailOk=v=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
  function setErr(fldId,on){$('#'+fldId).classList.toggle('err',on);if(on){$('#'+fldId).querySelector('.inp').setAttribute('aria-invalid','true');}else{$('#'+fldId).querySelector('.inp').removeAttribute('aria-invalid');}}
  function submitting(btn,label){btn.disabled=true;btn.dataset.t=btn.textContent;btn.innerHTML='<span class="spin" aria-hidden="true"></span> '+label;}
  function done(btn){btn.disabled=false;btn.textContent=btn.dataset.t;}

  $('form[data-panel="login"]').addEventListener('submit',e=>{
    e.preventDefault();const em=$('#l-em').value.trim(),pw=$('#l-pw').value;
    const e1=!emailOk(em),e2=!pw;setErr('l-em-fld',e1);setErr('l-pw-fld',e2);
    if(e1){$('#l-em').focus();return;} if(e2){$('#l-pw').focus();return;}
    const b=$('#l-submit');submitting(b,'登录中…');
    setTimeout(()=>{done(b);toast('登录成功,正在进入书库…');setTimeout(()=>location.href='home-discover.html',RM?200:800);},RM?150:1000);
  });
  $('form[data-panel="reg"]').addEventListener('submit',e=>{
    e.preventDefault();const nk=$('#r-nk').value.trim(),em=$('#r-em').value.trim(),pw=$('#r-pw').value,ag=$('#r-agree').checked;
    const e0=!nk,e1=!emailOk(em),e2=pw.length<8;setErr('r-nk-fld',e0);setErr('r-em-fld',e1);setErr('r-pw-fld',e2);
    if(e0){$('#r-nk').focus();return;} if(e1){$('#r-em').focus();return;} if(e2){$('#r-pw').focus();return;}
    if(!ag){toast('请先同意服务条款与隐私政策');return;}
    const b=$('#r-submit');submitting(b,'创建中…');
    setTimeout(()=>{done(b);toast('账号已创建,欢迎加入 Story Editor');setTimeout(()=>location.href='home-discover.html',RM?200:800);},RM?150:1000);
  });
  // 输入时清除错误
  $$('.inp').forEach(i=>i.addEventListener('input',()=>{const f=i.closest('.fld');f&&f.classList.remove('err');}));
  let tt;function toast(m){const el=$('#toast');el.textContent=m;el.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('on'),2400);}
</script>
</body>
</html>
