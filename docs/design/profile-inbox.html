<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="消息与互动 · 谁岔开了你的世界、谁在你的节点上续写、谁关注了你。" />
<title>消息与互动 · 万象 Story Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;510;590&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:        oklch(0.13 0.022 265);
    --bg-deep:   oklch(0.09 0.018 265);
    --surface:   oklch(0.19 0.030 265);
    --fg:        oklch(0.96 0.010 90);
    --muted:     oklch(0.72 0.020 265);
    --border:    oklch(1 0 0 / 0.11);
    --border-2:  oklch(1 0 0 / 0.20);
    --accent:    oklch(0.82 0.125 85);
    --bright:    oklch(0.88 0.008 265);

    --font-display:"Noto Serif SC", Georgia, "Songti SC", serif;
    --font-ui:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;

    --r-sm:8px; --r-md:12px; --r-lg:18px; --r-pill:999px;
    --ease:cubic-bezier(.2,0,0,1);
    --ring:0 0 0 2px oklch(0.09 0.018 265), 0 0 0 4px oklch(0.82 0.125 85);
    --ambient-hue:252;
  }
  .world-scope{
    --w-line:   oklch(0.72 0.140 var(--hue) / .85);
    --w-glow:   oklch(0.72 0.140 var(--hue) / .50);
    --w-sky-hi: oklch(0.34 0.115 var(--hue));
    --w-sky-md: oklch(0.22 0.085 var(--hue));
    --w-sky-lo: oklch(0.11 0.040 var(--hue));
    --w-halo:   oklch(0.48 0.130 var(--hue) / .75);
    --w-cloud:  oklch(0.20 0.050 var(--hue) / .85);
    --w-star:   oklch(0.98 0.020 var(--hue) / .90);
    --w-ink:    oklch(0.055 0.015 var(--hue));
    --w-text:   oklch(0.97 0.010 var(--hue));
    --w-kick:   oklch(0.86 0.090 var(--hue));
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg-deep);color:var(--fg);font-family:var(--font-ui);
    -webkit-font-smoothing:antialiased;min-height:100%}
  button{font-family:inherit;cursor:pointer;color:inherit}
  a{color:inherit;text-decoration:none}
  button:disabled{cursor:not-allowed}
  :focus-visible{outline:none;box-shadow:var(--ring);border-radius:var(--r-sm)}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
  [hidden]{display:none!important}

  .space{position:fixed;inset:0;z-index:0;
    background:
      radial-gradient(58% 46% at 74% 12%, oklch(0.30 0.075 var(--ambient-hue) / .40), transparent 62%),
      radial-gradient(46% 34% at 14% 86%, oklch(0.28 0.070 calc(var(--ambient-hue) + 52) / .26), transparent 66%),
      radial-gradient(70% 60% at 50% 46%, oklch(0.16 0.028 var(--ambient-hue)), oklch(0.08 0.016 var(--ambient-hue)) 78%);
    transition:background 1.1s var(--ease)}
  .stars{position:fixed;inset:0;z-index:1;pointer-events:none}
  .stars i{position:absolute;border-radius:50%;background:oklch(1 0 0);display:block}
  @keyframes twinkle{0%,100%{opacity:.25}50%{opacity:.95}}
  .grain{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.05;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
    background-size:140px 140px}
  .vignette{position:fixed;inset:0;z-index:3;pointer-events:none;
    background:radial-gradient(126% 100% at 50% 40%, transparent 56%, oklch(0.05 0.01 265 / .70) 100%)}

  .topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;
    padding:16px 26px;background:linear-gradient(180deg, oklch(0.09 0.018 265 / .94), oklch(0.09 0.018 265 / 0));
    backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px)}
  .brand{display:flex;align-items:center;gap:10px;font-weight:590;font-size:15px;letter-spacing:.02em}
  .brand .mark{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;
    background:oklch(1 0 0 / .05);border:1px solid var(--border)}
  .brand .zh{font-family:var(--font-display);font-weight:700;font-size:16px;letter-spacing:.1em}
  .brand .en{color:var(--muted);font-size:11.5px;letter-spacing:.16em;padding-left:10px;
    border-left:1px solid var(--border)}
  .topnav{margin-left:auto;display:flex;align-items:center;gap:6px}
  .topnav a{min-height:44px;padding:0 13px;border-radius:var(--r-sm);color:var(--muted);font-size:13.5px;
    font-weight:510;letter-spacing:.02em;display:inline-flex;align-items:center;
    transition:color .15s var(--ease),background .15s var(--ease)}
  .topnav a:hover{color:var(--fg);background:oklch(1 0 0 / .07)}
  .topnav a[aria-current]{color:var(--fg);background:oklch(1 0 0 / .07)}
  .btn-create{margin-left:8px;height:44px;padding:0 17px;border-radius:var(--r-pill);
    border:1px solid var(--border-2);background:transparent;color:var(--fg);
    font-size:13.5px;font-weight:590;letter-spacing:.02em;display:inline-flex;align-items:center;gap:7px;
    transition:background .16s var(--ease),border-color .16s var(--ease)}
  .btn-create:hover{background:oklch(1 0 0 / .10);border-color:oklch(1 0 0 / .32)}

  .wrap{position:relative;z-index:10;max-width:880px;margin:0 auto;padding:8px 26px 96px}

  .subnav{display:flex;align-items:center;gap:4px;padding:5px;border-radius:var(--r-pill);
    background:oklch(0.12 0.02 265 / .7);border:1px solid var(--border);width:max-content;max-width:100%;
    overflow-x:auto;scrollbar-width:none;margin-bottom:34px}
  .subnav::-webkit-scrollbar{display:none}
  .subnav a{white-space:nowrap;min-height:44px;padding:0 17px;border-radius:var(--r-pill);
    color:var(--muted);font-size:13.5px;font-weight:510;letter-spacing:.03em;
    display:inline-flex;align-items:center;gap:8px;
    transition:background .15s var(--ease),color .15s var(--ease)}
  .subnav a:hover{color:var(--fg);background:oklch(1 0 0 / .08)}
  .subnav a[aria-current="page"]{background:var(--bright);color:oklch(0.16 0.02 265);font-weight:590}
  .subnav .n{font-size:11.5px;font-variant-numeric:tabular-nums;opacity:.72}

  .head{margin-bottom:28px}
  .head .eyebrow{font-size:11px;letter-spacing:.26em;color:var(--muted);font-weight:590;margin-bottom:14px}
  .head h1{font-family:var(--font-display);font-weight:900;font-size:clamp(28px,3.6vw,40px);
    line-height:1.36;letter-spacing:0;max-width:16ch}
  .head .lead{margin-top:16px;font-family:var(--font-display);font-size:14.5px;line-height:1.95;
    color:var(--muted);max-width:56ch}

  /* ================= 筛选条 ================= */
  .bar{position:sticky;top:76px;z-index:30;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    padding:10px 0 14px;margin-bottom:14px;
    background:linear-gradient(180deg, oklch(0.09 0.018 265 / .96) 62%, oklch(0.09 0.018 265 / 0))}
  .segs{display:flex;align-items:center;gap:4px;padding:5px;border-radius:var(--r-pill);
    background:oklch(0.12 0.02 265 / .8);border:1px solid var(--border);
    overflow-x:auto;scrollbar-width:none;max-width:100%}
  .segs::-webkit-scrollbar{display:none}
  .segs button{white-space:nowrap;min-height:44px;padding:0 15px;border:0;border-radius:var(--r-pill);
    background:transparent;color:var(--muted);font-size:13px;font-weight:510;letter-spacing:.03em;
    display:inline-flex;align-items:center;gap:7px;
    transition:background .15s var(--ease),color .15s var(--ease)}
  .segs button:hover{color:var(--fg);background:oklch(1 0 0 / .09)}
  .segs button[aria-pressed="true"]{background:var(--bright);color:oklch(0.16 0.02 265);font-weight:590}
  .segs .n{font-size:11px;font-variant-numeric:tabular-nums;opacity:.7}
  .btn-ghost{min-height:44px;padding:0 16px;border-radius:var(--r-pill);border:1px solid var(--border-2);
    background:transparent;color:var(--fg);font-size:13px;font-weight:590;letter-spacing:.02em;
    display:inline-flex;align-items:center;gap:8px;
    transition:background .16s var(--ease),border-color .16s var(--ease)}
  .btn-ghost:hover{background:oklch(1 0 0 / .10);border-color:oklch(1 0 0 / .32)}
  .btn-ghost:disabled{color:oklch(0.50 0.014 265);border-color:oklch(1 0 0 / .09)}
  .btn-ghost:disabled:hover{background:transparent;border-color:oklch(1 0 0 / .09)}
  .bar .spacer{margin-left:auto}

  /* ================= 消息列表 ================= */
  .list{display:flex;flex-direction:column;gap:10px}
  .msg{position:relative;display:flex;align-items:flex-start;gap:16px;padding:16px 18px 16px 22px;
    border-radius:var(--r-md);border:1px solid var(--border);background:oklch(1 0 0 / .028);
    transition:background .16s var(--ease),border-color .16s var(--ease)}
  .msg:hover{background:oklch(1 0 0 / .07);border-color:var(--w-line)}
  .msg.unread{background:oklch(1 0 0 / .055);border-color:oklch(1 0 0 / .17)}
  .msg.unread:hover{background:oklch(1 0 0 / .095)}
  /* 未读用中性亮态,不占暖金 */
  .msg.unread::before{content:"";position:absolute;left:9px;top:23px;width:6px;height:6px;border-radius:50%;
    background:var(--bright)}

  .av{flex:none;width:44px;height:44px;border-radius:50%;overflow:hidden;position:relative;
    border:1px solid oklch(1 0 0 / .18)}
  /* 小尺寸下用较亮的两档天空,保证纯黑剪影仍读得出轮廓 */
  .av .sky{position:absolute;inset:0;background:linear-gradient(178deg, var(--w-halo), var(--w-sky-hi))}
  .av .fig{position:absolute;left:50%;bottom:-4%;width:30px;height:30px;margin-left:-15px;color:var(--w-ink)}
  .av .fig svg{width:100%;height:100%;display:block}
  .av.sys{display:grid;place-items:center;background:oklch(0.20 0.028 265);color:oklch(0.86 0.012 265)}

  .msg .body{flex:1 1 auto;min-width:0}
  .msg .line{font-size:14px;line-height:1.75;letter-spacing:.01em;color:oklch(0.94 0.008 265)}
  .msg .line b{font-weight:590;color:var(--fg)}
  .msg .line .w{font-family:var(--font-display);font-weight:700;color:var(--w-kick)}
  .msg .quote{margin-top:10px;padding-left:13px;border-left:1px solid var(--border-2);
    font-family:var(--font-display);font-size:13.5px;line-height:1.9;color:oklch(0.82 0.012 265)}
  .msg .foot{margin-top:11px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    font-size:11.5px;letter-spacing:.04em;color:var(--muted);font-variant-numeric:tabular-nums}
  .msg .foot a{display:inline-flex;align-items:center;gap:6px;min-height:44px;color:oklch(0.88 0.010 265);
    font-weight:590;transition:color .15s var(--ease)}
  .msg .foot a:hover{color:oklch(1 0 0)}
  .msg .kind{flex:none;padding:3px 9px;border-radius:var(--r-pill);font-size:10.5px;letter-spacing:.08em;
    font-weight:590;border:1px solid var(--border);color:var(--muted);background:oklch(1 0 0 / .04)}

  .msg .tools{flex:none;display:flex;align-items:center}
  .icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:var(--r-sm);
    border:1px solid transparent;background:transparent;color:oklch(0.62 0.016 265);
    transition:background .15s var(--ease),color .15s var(--ease),border-color .15s var(--ease)}
  .icon-btn:hover{background:oklch(1 0 0 / .10);color:var(--fg);border-color:var(--border-2)}

  .empty{border:1px dashed var(--border-2);border-radius:var(--r-md);padding:44px 26px;text-align:center}
  .empty p{font-family:var(--font-display);font-size:17px;line-height:1.7}
  .empty small{display:block;margin-top:10px;color:var(--muted);font-size:12.5px;line-height:1.85;
    max-width:38ch;margin-left:auto;margin-right:auto}

  .note{margin-top:34px;padding:16px 18px;border-radius:var(--r-md);border:1px solid var(--border);
    background:oklch(1 0 0 / .025);font-size:12.5px;line-height:1.9;color:var(--muted)}
  .note b{color:oklch(0.88 0.008 265);font-weight:590}

  .toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,10px);z-index:80;
    max-width:min(430px,calc(100vw - 32px));padding:12px 18px;border-radius:var(--r-pill);
    font-size:13px;line-height:1.5;letter-spacing:.02em;text-align:center;
    background:oklch(0.17 0.026 265 / .97);border:1px solid var(--border-2);color:var(--fg);
    box-shadow:0 20px 50px -28px oklch(0.02 0 0 / .9);
    opacity:0;visibility:hidden;transition:opacity .22s var(--ease),transform .22s var(--ease),visibility .22s}
  .toast.on{opacity:1;visibility:visible;transform:translate(-50%,0)}

  @media(max-width:820px){
    .topbar{padding:12px 16px;gap:8px}
    .brand .en{display:none}
    .topnav{gap:2px}
    .topnav a{padding:0 9px;font-size:12.5px}
    .btn-create{margin-left:4px;height:44px;padding:0 14px;font-size:12.5px}
    .wrap{padding:8px 16px 80px}
    .bar{top:68px}
    .bar .spacer{margin-left:0;width:100%}
    .bar .btn-ghost{width:100%;justify-content:center}
  }
  @media(max-width:560px){
    .topnav a[data-od-id="nav-history"],.topnav a[data-od-id="nav-works-library"]{display:none}
    .btn-create{width:44px;padding:0;justify-content:center}
    .btn-create .label{display:none}
    .msg{padding:14px 14px 14px 20px;gap:12px}
    .msg .tools{position:absolute;right:6px;top:6px}
    .msg .kind{display:none}
  }
  @media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<div class="space" data-od-id="space-backdrop"></div>
<div class="stars" id="stars" aria-hidden="true"></div>

<header class="topbar" data-od-id="topbar">

        <circle cx="12" cy="20" r="1.3" fill="currentColor" stroke="none"/>
        <circle cx="7.4" cy="8.3" r="2.2" fill="var(--accent)" stroke="none"/>

      </svg>
    </span>
    <span class="zh">万象</span>

  <nav class="topnav" aria-label="主导航" data-od-id="primary-navigation">

</header>

<main class="wrap">
  <nav class="subnav" aria-label="我的空间" data-od-id="space-subnav">
    <a href="profile-space.html" data-od-id="sub-space">主页</a>
    <a href="profile-drafts.html" data-od-id="sub-drafts">草稿箱 <span class="n">3</span></a>
    <a href="profile-inbox.html" aria-current="page" data-od-id="sub-inbox">消息 <span class="n" id="sub-n">4</span></a>
    <a href="profile-settings.html" data-od-id="sub-settings">设置</a>
  </nav>

  <section class="head" data-od-id="inbox-head">
    <p class="eyebrow">消息与互动</p>
    <h1>谁岔开了你的世界。</h1>
    <p class="lead">这里只有真的发生过的事:有人从你的节点分叉、有人续写下去、有人把某条支线改写成了另一个结局。没有点赞,没有徽章,没有等级。</p>
  </section>

  <div class="bar" data-od-id="inbox-filters">
    <div class="segs" role="group" aria-label="消息类型筛选" id="segs"></div>
    <span class="spacer"></span>
    <button class="btn-ghost" type="button" id="mark-all" data-od-id="cta-mark-all-read">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5 9 17.5 20 6.5"/></svg>
      全部标记已读
    </button>
  </div>

  <p class="sr-only" role="status" aria-live="polite" id="announce"></p>
  <div class="list" id="list"></div>

  <p class="note" data-od-id="inbox-note">
    已读状态存在这台设备上(键 <b>wanxiang-inbox-v1</b>)。接后端前不会同步到其他设备。
    衍生事件的原始数据与 <b>社区广场</b> 同一份契约,这里只是按「与我有关」筛过一遍。
  </p>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="assets/works-data.js"></script>
<script>
(function(){
  'use strict';
  var RM = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var KEY = 'wanxiang-inbox-v1';

  /* ---------------- 消息数据 ----------------
     t: fork 开新分支 / continue 续写节点 / rewrite 世界被改写 / follow 关注 / system 系统 */

    {id:'m1', t:'fork', who:'沈砚', wf:'radio', w:'深潜者笔记', h:196, ago:'12 分钟前', unread:true,

     go:{label:'去这个节点', href:'play-story.html'}},

    {id:'m4', t:'follow', who:'青冥', wf:'reach', h:252, ago:'昨天', unread:true,
     go:{label:'看 TA 的空间', href:'profile-space.html'}},
    {id:'m5', t:'fork', who:'南舟', wf:'umbrella', w:'街角面包店的第七年', h:132, ago:'昨天', unread:false,

     q:'我想试试「店没有关,只是换了人」的版本。',
     go:{label:'看这条分支', href:'derivation-graph.html'}},
    {id:'m6', t:'continue', who:'言澈', wf:'walk', w:'深潜者笔记', h:196, ago:'3 天前', unread:false,

     q:'补了两页日志,把「希望自己没看见的东西」留成了未点亮的节点。',
     go:{label:'去这个节点', href:'play-story.html'}},
    {id:'m7', t:'system', w:'蝉鸣停止的那天', ago:'1 周前', unread:false,
     sys:'《蝉鸣停止的那天》被收藏满 1,000 次。',
     q:'这条只是通知,收藏数不影响任何排序,也不参与推荐。',
     go:{label:'去作品页', href:'works-library.html'}},
    {id:'m8', t:'follow', who:'风陵渡', wf:'blade', h:168, ago:'2 周前', unread:false,
     go:{label:'看 TA 的空间', href:'profile-space.html'}}
  ].map(function(message){
    if(!message.w) return message;
    var work = (window.WANXIANG_WORKS || []).filter(function(item){ return item.n === message.w; })[0];
    if(!work) return message;
    return Object.assign({}, message, {
      h: work.h,
      go: Object.assign({}, message.go, { href: window.WANXIANG_WORK_LINK(work) })
    });
  });

  var KINDS = [
    {k:'all',      label:'全部'},
    {k:'fork',     label:'开新分支'},
    {k:'continue', label:'续写节点'},
    {k:'rewrite',  label:'世界被改写'},
    {k:'follow',   label:'关注'},
    {k:'system',   label:'系统'}
  ];
  var KIND_LABEL = {fork:'开新分支', continue:'续写节点', rewrite:'世界被改写', follow:'关注', system:'系统'};

  function figure(type){
    var head='<circle cx="50" cy="14" r="7.4"/>';
    var torso='<path d="M50 22c-5.4 0-9.4 3.6-10.1 8.7l-1.7 12.9c-.3 2.3 1.5 4.2 3.8 4.2h16c2.3 0 4.1-1.9 3.8-4.2l-1.7-12.9C59.4 25.6 55.4 22 50 22z"/>';
    var legs='<path d="M45.6 47 43.6 80" stroke-width="6" stroke-linecap="round" fill="none"/>'+
             '<path d="M54.4 47 56.4 80" stroke-width="6" stroke-linecap="round" fill="none"/>';
    var arms='';
    if(type==='gaze'){
      head='<circle cx="49" cy="13" r="7.4"/>';
      arms='<path d="M41 30 35 49" stroke-width="5" stroke-linecap="round" fill="none"/>'+
           '<path d="M59 30 66 47" stroke-width="5" stroke-linecap="round" fill="none"/>';
    }else if(type==='radio'){
      arms='<path d="M41 30 36 50" stroke-width="5" stroke-linecap="round" fill="none"/>'+
           '<path d="M59 31 64 38 57 23" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>'+
           '<rect x="53" y="15" width="6" height="9" rx="1.4"/>';
    }else if(type==='blade'){
      arms='<path d="M41 30 36 50" stroke-width="5" stroke-linecap="round" fill="none"/>'+
           '<path d="M59 30 64 50" stroke-width="5" stroke-linecap="round" fill="none"/>'+
           '<path d="M64 52 72 16" stroke-width="2.6" stroke-linecap="round" fill="none"/>';
    }else if(type==='umbrella'){
      arms='<path d="M41 30 36 50" stroke-width="5" stroke-linecap="round" fill="none"/>'+
           '<path d="M59 30 63 19" stroke-width="5" stroke-linecap="round" fill="none"/>'+
           '<path d="M63 19 63 8" stroke-width="2.2" stroke-linecap="round" fill="none"/>'+
           '<path d="M47 12q16-13 32 0z"/>';
    }else if(type==='reach'){
      arms='<path d="M41 30 29 19" stroke-width="5" stroke-linecap="round" fill="none"/>'+
           '<path d="M59 30 71 19" stroke-width="5" stroke-linecap="round" fill="none"/>';
    }else{
      legs='<path d="M45.6 47 40 79" stroke-width="6" stroke-linecap="round" fill="none"/>'+
           '<path d="M54.4 47 61 78" stroke-width="6" stroke-linecap="round" fill="none"/>';
      arms='<path d="M41 30 45 49" stroke-width="5" stroke-linecap="round" fill="none"/>'+
           '<path d="M59 30 55 49" stroke-width="5" stroke-linecap="round" fill="none"/>';
    }
    return '<svg viewBox="0 0 100 92" aria-hidden="true"><g fill="currentColor" stroke="currentColor">'
      + head + torso + legs + arms + '</g></svg>';
  }
  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function $(id){ return document.getElementById(id); }
  function messageWork(message){
    if(!message.w || !window.WANXIANG_WORKS) return null;
    for(var i = 0; i < window.WANXIANG_WORKS.length; i++){
      if(window.WANXIANG_WORKS[i].n === message.w) return window.WANXIANG_WORKS[i];
    }
    return null;
  }
  function messageHref(message){
    var work = messageWork(message);
    return work && window.WANXIANG_WORK_LINK ? window.WANXIANG_WORK_LINK(work) : message.go.href;
  }
  function messageLabel(message){
    var work = messageWork(message);
    return work && !work.playable && message.t === 'continue' ? '看星图' : message.go.label;
  }

  /* ---------------- 已读状态 ---------------- */
  var read = {};
  try{ read = JSON.parse(window.localStorage.getItem(KEY) || '{}') || {}; }catch(error){ read = {}; }
  /* 三态:1 = 手动已读,-1 = 手动标回未读,缺省 = 用消息自带的初始状态。
     只存布尔会让「把已读标回未读」在原本就是已读的消息上失效。 */
  function isUnread(m){
    if(read[m.id] === 1) return false;
    if(read[m.id] === -1) return true;
    return !!m.unread;
  }
  function persist(){
    try{ window.localStorage.setItem(KEY, JSON.stringify(read)); }catch(error){}
  }

  var filter = 'all';

  function countOf(k){
    var n = 0, i;
    for(i=0;i<MSGS.length;i++){
      if(k === 'all' || MSGS[i].t === k){ if(isUnread(MSGS[i])) n++; }
    }
    return n;
  }

  function paintSegs(){
    var box = $('segs'), html = '', i;
    for(i=0;i<KINDS.length;i++){
      var k = KINDS[i], n = countOf(k.k);
      html += '<button type="button" data-k="'+k.k+'" aria-pressed="'+(filter === k.k)+'"'
        + ' data-od-id="filter-'+k.k+'">'+k.label
        + (n ? ' <span class="n" aria-label="'+n+' 条未读">'+n+'</span>' : '')
        + '</button>';
    }
    box.innerHTML = html;
    box.querySelectorAll('button').forEach(function(b){
      b.addEventListener('click', function(){
        filter = b.dataset.k;
        paintSegs();
        paintList(true);
      });
    });
  }

  function sentence(m){
    if(m.t === 'system') return '<b>万象</b> · ' + esc(m.sys);
    if(m.t === 'follow') return '<b>' + esc(m.who) + '</b> 关注了你。';
    var verb = m.t === 'fork' ? '从你的节点开了一条新分支'
             : m.t === 'continue' ? '在你的节点上续写了下去'
             : '把这条支线改写成了另一个结局';
    return '<b>' + esc(m.who) + '</b> ' + verb + '：<span class="w">《' + esc(m.w) + '》</span>'
      + (m.node ? ' · ' + esc(m.node) : '')
      + (m.bn ? ' → <span class="w">' + esc(m.bn) + '</span>' : '');
  }

  function paintList(announce){
    var box = $('list'), html = '', i, shown = 0;
    for(i=0;i<MSGS.length;i++){
      var m = MSGS[i];
      if(filter !== 'all' && m.t !== filter) continue;
      shown++;
      var un = isUnread(m);
      var hue = m.h || 252;
      var av = m.t === 'system'
        ? '<span class="av sys" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19.5v-6M12 13.5 7.7 8.9M12 13.5l4.3-4.6"/><circle cx="7.4" cy="8.3" r="1.9" fill="currentColor" stroke="none"/><circle cx="16.6" cy="8.3" r="1.9" fill="currentColor" stroke="none"/></svg></span>'
        : '<span class="av" aria-hidden="true"><span class="sky"></span><span class="fig">'+figure(m.wf)+'</span></span>';

      html += '<article class="msg world-scope'+(un ? ' unread' : '')+'" style="--hue:'+hue+'"'
        + ' data-od-id="msg-'+esc(m.id)+'">'
        + av
        + '<div class="body">'
        +   '<p class="line">'+sentence(m)+'</p>'
        +   (m.q ? '<p class="quote">'+esc(m.q)+'</p>' : '')
        +   '<p class="foot"><span class="kind">'+KIND_LABEL[m.t]+'</span><span>'+esc(m.ago)+'</span>'
        +     (un ? '<span>未读</span>' : '')
        +     '<a href="'+esc(messageHref(m))+'" aria-label="'+esc(messageLabel(m))+'" data-od-id="cta-go-'+esc(m.id)+'">'+esc(messageLabel(m))
        +       '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg>'
        +     '</a></p>'
        + '</div>'
        + '<div class="tools">'
        +   '<button class="icon-btn" type="button" data-read="'+esc(m.id)+'" data-on="'+(un ? '1' : '0')+'"'
        +     ' aria-label="'+(un ? '标记为已读' : '标记为未读')+'" data-od-id="cta-toggle-read-'+esc(m.id)+'">'
        +     (un
              ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 9 17.5 20 6.5"/></svg>'
              : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="7.4"/></svg>')
        +   '</button>'
        + '</div>'
        + '</article>';
    }

    if(!shown){
      box.className = '';
      var lb = filter === 'all' ? '' : KINDS.filter(function(x){ return x.k === filter; })[0].label;
      box.innerHTML = '<div class="empty"><p>'
        + (filter === 'all' ? '还没有人碰过你的世界' : '这一类还没有消息')
        + '</p><small>'
        + (filter === 'all'
            ? '发布一个世界之后,别人从任意节点分叉、续写或改写,都会落在这里。'
            : '「' + esc(lb) + '」类型下暂时没有内容。换一个筛选看看。')
        + '</small></div>';
    }else{
      box.className = 'list';
      box.innerHTML = html;
      box.querySelectorAll('[data-read]').forEach(function(b){
        b.addEventListener('click', function(){
          var id = b.dataset.read;
          read[id] = b.dataset.on === '1' ? 1 : -1;
          persist();
          paintSegs();
          paintList(false);
          say(b.dataset.on === '1' ? '已标记为已读' : '已标记为未读');
        });
      });
    }

    var total = countOf('all');
    $('sub-n').textContent = String(total);
    $('mark-all').disabled = total === 0;
    if(announce){
      $('announce').textContent = '筛选后共 ' + shown + ' 条消息,其中未读 ' + countOf(filter) + ' 条。';
    }
  }

  $('mark-all').addEventListener('click', function(){
    var i;
    for(i=0;i<MSGS.length;i++) read[MSGS[i].id] = 1;
    persist();
    paintSegs();
    paintList(false);
    say('全部消息已标记为已读。');
    $('mark-all').focus();
  });

  var toast = $('toast'), toastT;
  function say(msg){
    toast.textContent = msg;
    toast.classList.add('on');
    clearTimeout(toastT);
    toastT = setTimeout(function(){ toast.classList.remove('on'); }, 2800);
  }

  (function(){
    var box = $('stars'), html = '', i;
    for(i=0;i<118;i++){
      var s = Math.random() < 0.86 ? 1 : 2;
      var o = (0.13 + Math.random()*0.52).toFixed(2);
      var tw = (!RM && Math.random() < 0.18)
        ? 'animation:twinkle '+(3+Math.random()*4).toFixed(1)+'s ease-in-out infinite;animation-delay:'+(Math.random()*5).toFixed(1)+'s;'
        : '';
      html += '<i style="left:'+(Math.random()*100).toFixed(2)+'%;top:'+(Math.random()*100).toFixed(2)
           + '%;width:'+s+'px;height:'+s+'px;opacity:'+o+';'+tw+'"></i>';
    }
    box.innerHTML = html;
  })();

  paintSegs();
  paintList(false);
})();
</script>
</body>
</html>
