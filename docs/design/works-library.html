    @media (max-width:720px){.intro{padding-top:28px;padding-bottom:27px}.intro h1{font-size:clamp(36px,10vw,42px)}.intro p{font-size:13.5px}.search-wrap{min-height:48px}.search{height:46px}.sort{min-width:94px;height:34px;font-size:12px}.sort-field{padding-right:27px}}

    /* Sort menu redesign: a compact current-value control with a quiet, anchored choice list. */
    .sort-field{height:30px;display:flex;align-items:center;gap:9px;padding:0 7px 0 15px;border-left:1px solid var(--border)}

    @media (max-width:390px){.sort-field{padding:0 6px 0 12px}.sort-trigger{min-width:106px;height:36px}.sort-popover{right:0;width:174px}}

<body>
  <div class="space-backdrop" aria-hidden="true" data-od-id="space-backdrop"></div>

  <main class="page" id="main-content" tabindex="-1" data-od-id="works-library-page">

      <p>在作品馆中，循着你感兴趣的题材、情绪与线索，找到下一段愿意亲自走进去的故事。</p>
      <div class="search-wrap" data-od-id="catalog-controls">
        <div class="search-field">
          <label class="sr-only" for="search">搜索作品</label>
          <svg class="search-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="10.8" cy="10.8" r="5.8"></circle><path d="m15.2 15.2 4.1 4.1"></path></svg>
          <input class="search" id="search" type="search" placeholder="搜索作品名、题材或一句话钩子" autocomplete="off" aria-controls="grid" aria-describedby="catalogFeedback" data-focus-id="search" data-od-id="works-search" />

            <button class="sort-trigger" id="sortTrigger" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="sortMenu" data-focus-id="sort-trigger" data-od-id="sort-trigger">

            </button>
            <div class="sort-popover" id="sortMenu" role="menu" aria-label="排序方式" hidden>
              <button class="sort-option" type="button" role="menuitemradio" aria-checked="true" data-sort="featured" data-od-id="sort-option-featured"><span>推荐</span></button>
              <button class="sort-option" type="button" role="menuitemradio" aria-checked="false" data-sort="plays" data-od-id="sort-option-plays"><span>游玩最多</span></button>
              <button class="sort-option" type="button" role="menuitemradio" aria-checked="false" data-sort="likes" data-od-id="sort-option-likes"><span>收藏最多</span></button>
              <button class="sort-option" type="button" role="menuitemradio" aria-checked="false" data-sort="title" data-od-id="sort-option-title"><span>作品名</span></button>
            </div>
          </div>
        </div>
      </div>
    </section>
    <section class="catalog" aria-label="作品浏览" data-od-id="works-catalog">
      <aside class="filters" aria-label="作品筛选" data-od-id="works-filters">
        <section class="filter-group" aria-labelledby="genre-label"><p class="filter-title" id="genre-label">题材</p><div class="filter-list" id="genreFilters"></div></section>
        <section class="filter-group" aria-labelledby="attribute-label"><p class="filter-title" id="attribute-label">故事线索</p><label class="check"><input type="checkbox" id="hasHidden" data-od-id="filter-hidden" />含隐藏属性</label><label class="check"><input type="checkbox" id="hasReveal" data-od-id="filter-reveal" />含渐显属性</label></section>
      </aside>
      <div class="catalog-main">
        <div class="resultbar" data-od-id="works-result-summary"><div><strong id="resultCount"></strong><br><span id="resultDetail"></span></div><button class="reset" id="reset" type="button" hidden data-od-id="reset-filters">清除筛选</button></div>
        <p class="sr-only" id="catalogFeedback" role="status" aria-live="polite"></p>
        <div class="grid" id="grid" aria-busy="true" data-od-id="works-grid"></div>
        <div class="pagination" id="pagination" aria-label="作品分页" data-od-id="works-pagination"></div>
      </div>
    </section>
  </main>
  <script src="assets/works-data.js"></script>
<script>
(function(){
    'use strict';
    (function(){
      var stars=document.getElementById('stars'),html='',i,reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      for(i=0;i<150;i++){
        var size=Math.random()<.86?1:2,opacity=(.16+Math.random()*.62).toFixed(2),twinkle=!reduced&&Math.random()<.22?'animation:sky-twinkle '+(3+Math.random()*4).toFixed(1)+'s ease-in-out infinite;animation-delay:'+(Math.random()*5).toFixed(1)+'s;':'';
        html+='<i style="left:'+(Math.random()*100).toFixed(2)+'%;top:'+(Math.random()*100).toFixed(2)+'%;width:'+size+'px;height:'+size+'px;opacity:'+opacity+';'+twinkle+'"></i>';
      }
      stars.innerHTML=html;
    }());
    var WORKS = window.WANXIANG_WORKS || [];

    var CATEGORIES=['全部','惊悚悬疑','科幻幻想','古风奇幻','青春情感','都市日常'];
    var categoryMap={
      '最后的深夜电台':'惊悚悬疑','戏楼夜半开锣':'惊悚悬疑','第十三位客人':'惊悚悬疑','深潜者笔记':'惊悚悬疑',
      '把太阳寄给你':'科幻幻想','霧虹不眠':'科幻幻想','锈海行舟':'科幻幻想',
      '雪满刀锋':'古风奇幻','斩却三千烦恼':'古风奇幻',
      '樱花落下的速度':'青春情感','蝉鸣停止的那天':'青春情感',
      '街角面包店的第七年':'都市日常'
    };
    var state={genre:'全部',query:'',hidden:false,reveal:false,sort:'featured',page:1};
    var pageSize=6;
    var $=function(id){return document.getElementById(id)};
    var grid=$('grid'),pagination=$('pagination'),reset=$('reset'),feedback=$('catalogFeedback');
    var sortTrigger=$('sortTrigger'),sortCurrent=$('sortCurrent'),sortMenu=$('sortMenu');
    var initialTimer;

    var sortLabels={featured:'推荐',plays:'游玩最多',likes:'收藏最多',title:'作品名'};
    function closeSortMenu(){if(!sortMenu)return;sortMenu.hidden=true;sortTrigger.setAttribute('aria-expanded','false')}
    function syncSortMenu(){if(!sortMenu)return;sortCurrent.textContent=sortLabels[state.sort];sortMenu.querySelectorAll('[data-sort]').forEach(function(option){option.setAttribute('aria-checked',String(option.dataset.sort===state.sort))})}
    function chooseSort(value){state.sort=value;state.page=1;syncSortMenu();closeSortMenu();refresh('sort-trigger')}
    function numberOf(v){var n=parseFloat(v);return v.indexOf('万')>-1?n*10000:n}
    function categoryOf(w){return categoryMap[w.n]||'都市日常'}
    function card(w,index){return '<a class="work world-scope" href="'+window.WANXIANG_WORK_LINK(w)+'" style="--hue:'+w.h+'" aria-label="进入《'+w.n+'》" data-od-id="work-card-'+(index+1)+'"><div class="scene" data-od-id="work-cover-'+(index+1)+'"><img class="cover-image '+(w.coverClass||'')+'" src="'+w.cover+'" alt="'+w.n+' · '+w.coverStyle+'风格封面" loading="lazy" decoding="async"><span class="cover-kind" aria-hidden="true">'+w.coverStyle+'</span><span class="cover-fallback" role="status">封面暂不可用</span></div><div class="work-body"><p class="kicker">'+w.k+'</p><h2>'+w.n+'</h2><p class="hook">'+w.t+'</p><div class="work-footer"><span class="metrics"><span>游玩 '+w.p+'</span><span>收藏 '+w.l+'</span></span><span class="open">走进 <span aria-hidden="true">→</span></span></div></div></a>'}
    function bindCoverFallbacks(){grid.querySelectorAll('.cover-image').forEach(function(image){image.addEventListener('error',function(){var scene=image.closest('.scene');if(scene)scene.classList.add('is-image-missing')},{once:true})})}
    function skeleton(){var cards='';for(var i=0;i<pageSize;i++){cards+='<article class="skeleton" aria-hidden="true"><div class="skeleton-scene"></div><div class="skeleton-body"><div class="skeleton-line short"></div><div class="skeleton-line title"></div><div class="skeleton-line"></div><div class="skeleton-line"></div></div></article>'}return cards}
    function currentWorks(){var q=state.query.trim().toLowerCase();var result=WORKS.filter(function(w){var text=[w.n,w.k,w.t,w.w,w.a.join(' ')].join(' ').toLowerCase();return (state.genre==='全部'||categoryOf(w)===state.genre)&&(!q||text.indexOf(q)>-1)&&(!state.hidden||w.a.some(function(a){return a.indexOf('隐藏')>-1}))&&(!state.reveal||w.a.some(function(a){return a.indexOf('渐显')>-1}))});return result.sort(function(a,b){if(state.sort==='plays')return numberOf(b.p)-numberOf(a.p);if(state.sort==='likes')return numberOf(b.l)-numberOf(a.l);if(state.sort==='title')return a.n.localeCompare(b.n,'zh-CN');return WORKS.indexOf(a)-WORKS.indexOf(b)})}
    function announce(message){feedback.textContent='';window.setTimeout(function(){feedback.textContent=message},0)}
    function restoreFocus(focusId){if(!focusId)return;window.requestAnimationFrame(function(){var elements=document.querySelectorAll('[data-focus-id]');for(var i=0;i<elements.length;i++){if(elements[i].getAttribute('data-focus-id')===focusId){elements[i].focus({preventScroll:true});break}}})}
    function makeFilters(){var html=CATEGORIES.map(function(g,index){var count=g==='全部'?WORKS.length:WORKS.filter(function(w){return categoryOf(w)===g}).length;return '<button class="filter" type="button" data-genre="'+g+'" data-focus-id="genre-'+index+'" aria-pressed="'+(g===state.genre)+'" data-od-id="genre-filter-'+index+'"><span>'+g+'</span><span class="count">'+count+'</span></button>'}).join('');$('genreFilters').innerHTML=html;$('genreFilters').querySelectorAll('button').forEach(function(button){button.addEventListener('click',function(){state.genre=button.dataset.genre;state.page=1;refresh(button.dataset.focusId)})})}
    function renderLoading(){grid.setAttribute('aria-busy','true');grid.innerHTML=skeleton();pagination.innerHTML='';$('resultCount').textContent='正在整理作品';$('resultDetail').textContent='请稍候，星空正在显现。';reset.hidden=true;announce('正在整理作品')}
    function load(focusId){window.clearTimeout(initialTimer);renderLoading();initialTimer=window.setTimeout(function(){render(focusId)},180)}
    function showError(){grid.setAttribute('aria-busy','false');grid.innerHTML='<section class="catalog-error" role="alert" data-od-id="catalog-error"><div><h2>暂时无法整理这片星空。</h2><p>请重新载入作品馆；你刚才的筛选条件会被保留。</p><button class="retry" type="button" id="retry" data-od-id="retry-catalog">重新载入</button></div></section>';pagination.innerHTML='';$('resultCount').textContent='作品馆暂不可用';$('resultDetail').textContent='请稍后重试';reset.hidden=true;announce('作品馆暂时无法整理，请重新载入。');$('retry').addEventListener('click',function(){load('retry-catalog')})}
    function render(focusId){try{syncSortMenu();makeFilters();var items=currentWorks(),pages=Math.max(1,Math.ceil(items.length/pageSize));if(state.page>pages)state.page=pages;var start=(state.page-1)*pageSize,shown=items.slice(start,start+pageSize);$('resultCount').textContent='找到 '+items.length+' 部作品';$('resultDetail').textContent=items.length?'当前展示 '+(start+1)+'–'+(start+shown.length)+' 部，共 '+WORKS.length+' 部作品':'试试换个关键词或筛选条件';reset.hidden=state.genre==='全部'&&!state.query&&!state.hidden&&!state.reveal&&state.sort==='featured';grid.setAttribute('aria-busy','false');grid.innerHTML=shown.length?shown.map(function(w){return card(w,WORKS.indexOf(w))}).join(''):'<section class="empty" data-od-id="empty-results"><div><h2>这一片星空还没有回应。</h2><p>换一个题材，或清除当前筛选条件。</p><button type="button" id="emptyReset" data-od-id="empty-reset">回到所有作品</button></div></section>';if(shown.length)bindCoverFallbacks();if(!shown.length)$('emptyReset').addEventListener('click',function(){clear('search')});pagination.innerHTML='';if(shown.length){var prev=document.createElement('button');prev.className='page-btn';prev.type='button';prev.textContent='←';prev.disabled=state.page===1;prev.setAttribute('aria-label','上一页');prev.setAttribute('data-focus-id','page-prev');prev.addEventListener('click',function(){state.page--;render('page-prev')});pagination.appendChild(prev);for(var i=1;i<=pages;i++){var b=document.createElement('button');b.className='page-btn';b.type='button';b.textContent=i;b.setAttribute('aria-label','第 '+i+' 页');b.setAttribute('data-focus-id','page-'+i);if(i===state.page)b.setAttribute('aria-current','page');b.addEventListener('click',(function(p){return function(){state.page=p;render('page-'+p)}})(i));pagination.appendChild(b)}var next=document.createElement('button');next.className='page-btn';next.type='button';next.textContent='→';next.disabled=state.page===pages;next.setAttribute('aria-label','下一页');next.setAttribute('data-focus-id','page-next');next.addEventListener('click',function(){state.page++;render('page-next')});pagination.appendChild(next);var status=document.createElement('span');status.className='page-status';status.textContent='第 '+state.page+' / '+pages+' 页';pagination.appendChild(status)}announce(items.length?'已显示 '+items.length+' 部作品。':'没有符合当前条件的作品。');restoreFocus(focusId)}catch(error){showError()}}
    function clear(focusId){state={genre:'全部',query:'',hidden:false,reveal:false,sort:'featured',page:1};$('search').value='';syncSortMenu();$('hasHidden').checked=false;$('hasReveal').checked=false;render(focusId)}
    function refresh(focusId){window.clearTimeout(initialTimer);grid.setAttribute('aria-busy','true');$('resultCount').textContent='正在更新结果';$('resultDetail').textContent='根据当前条件重新排列作品。';announce('正在更新作品结果');initialTimer=window.setTimeout(function(){render(focusId)},150)}
    $('search').addEventListener('input',function(){state.query=this.value;state.page=1;refresh()});sortTrigger.addEventListener('click',function(){var opening=sortMenu.hidden;sortMenu.hidden=!opening;sortTrigger.setAttribute('aria-expanded',String(opening));if(opening){var current=sortMenu.querySelector('[aria-checked=\"true\"]');if(current)current.focus()}});sortMenu.querySelectorAll('[data-sort]').forEach(function(option){option.addEventListener('click',function(){chooseSort(option.dataset.sort)})});sortMenu.addEventListener('keydown',function(event){var options=Array.prototype.slice.call(sortMenu.querySelectorAll('[data-sort]')),index=options.indexOf(document.activeElement),nextIndex;if(event.key==='Escape'){event.preventDefault();closeSortMenu();sortTrigger.focus();return}if(event.key==='ArrowDown'||event.key==='ArrowUp'||event.key==='Home'||event.key==='End'){event.preventDefault();if(event.key==='Home')nextIndex=0;else if(event.key==='End')nextIndex=options.length-1;else nextIndex=(index+(event.key==='ArrowDown'?1:-1)+options.length)%options.length;options[nextIndex].focus()}else if((event.key==='Enter'||event.key===' ')&&index>-1){event.preventDefault();chooseSort(options[index].dataset.sort)}});document.addEventListener('click',function(event){if(!event.target.closest('.sort-menu'))closeSortMenu()});document.addEventListener('keydown',function(event){if(event.key==='Escape'&&!sortMenu.hidden){closeSortMenu();sortTrigger.focus()}});$('hasHidden').addEventListener('change',function(){state.hidden=this.checked;state.page=1;refresh()});$('hasReveal').addEventListener('change',function(){state.reveal=this.checked;state.page=1;refresh()});reset.addEventListener('click',function(){clear('search')});load();
  }());
  </script>
