<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="万象 · Story Editor —— 一个灵感,长成一片星空。AI 互动剧情共创社区。" />
<title>万象 · Story Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;510;590&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    /* ——— 深空基底(OKLch) ——— */
    --bg:        oklch(0.13 0.022 265);
    --bg-deep:   oklch(0.09 0.018 265);
    --surface:   oklch(0.19 0.030 265);
    --fg:        oklch(0.96 0.010 90);
    --muted:     oklch(0.72 0.020 265);
    --border:    oklch(1 0 0 / 0.11);
    --border-2:  oklch(1 0 0 / 0.20);
    --accent:    oklch(0.82 0.125 85);      /* 暖金 · 全局唯一强调 */
    --accent-dim:oklch(0.66 0.100 85);

    --font-display:"Noto Serif SC", Georgia, "Songti SC", serif;
    --font-ui:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;

    --r-sm:8px; --r-md:12px; --r-lg:18px; --r-pill:999px;
    --ease:cubic-bezier(.2,0,0,1);
    /* 双层焦点环:内圈压深底,外圈暖金。单层暖金落在亮态按钮上会消失。 */
    --ring:0 0 0 2px oklch(0.09 0.018 265), 0 0 0 4px oklch(0.82 0.125 85);

    --card-w:170px; --card-h:228px;

    /* 环境色相:当前所在世界。聚焦某部作品时过渡到它的 hue,
       整片深空随之被那个世界「染色」——但 UI 强调色始终是唯一的暖金,不参与染色。 */
    --ambient-hue:252;
  }

  /* ——— 世界作用域:只设 --hue,下列角色 token 全部自动重算 ———
     纪律取自 Mizuki:每个角色的 L / C 固定,只有 H 变化。
     token 声明在使用它的元素上,因此每张卡按自己的 --hue 解析。 */
  .world-scope{
    --w-line:   oklch(0.72 0.140 var(--hue) / .85);
    --w-glow:   oklch(0.72 0.140 var(--hue) / .50);
    --w-glow-lg:oklch(0.72 0.140 var(--hue) / .55);
    --w-sky-hi: oklch(0.34 0.115 var(--hue));
    --w-sky-md: oklch(0.22 0.085 var(--hue));
    --w-sky-lo: oklch(0.11 0.040 var(--hue));
    --w-halo:   oklch(0.48 0.130 var(--hue) / .75);
    --w-cloud:  oklch(0.20 0.050 var(--hue) / .85);
    --w-cloud2: oklch(0.44 0.090 var(--hue) / .50);
    --w-star:   oklch(0.98 0.020 var(--hue) / .90);
    --w-ink:    oklch(0.055 0.015 var(--hue));
    --w-plate:  oklch(0.050 0.015 var(--hue) / .92);
    --w-text:   oklch(0.97 0.010 var(--hue));
    --w-kick:   oklch(0.86 0.090 var(--hue));
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    background:var(--bg-deep); color:var(--fg);
    font-family:var(--font-ui); -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;
  }
  button{font-family:inherit;cursor:pointer;color:inherit}
  a{color:inherit;text-decoration:none}
  button:disabled{cursor:not-allowed}
  :focus-visible{outline:none;box-shadow:var(--ring);border-radius:var(--r-sm)}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}

  /* ================= 深空背景 ================= */
  .space{position:fixed;inset:0;z-index:0;
    background:
      radial-gradient(58% 46% at 74% 16%, oklch(0.30 0.075 var(--ambient-hue) / .48), transparent 62%),
      radial-gradient(46% 34% at 16% 88%, oklch(0.28 0.070 calc(var(--ambient-hue) + 52) / .34), transparent 66%),
      radial-gradient(70% 60% at 50% 50%, oklch(0.17 0.030 var(--ambient-hue)), oklch(0.08 0.016 var(--ambient-hue)) 78%);
    transition:background 1.1s var(--ease);
  }
  .stars{position:fixed;inset:0;z-index:1;pointer-events:none}
  .stars i{position:absolute;border-radius:50%;background:oklch(1 0 0);display:block}
  @keyframes twinkle{0%,100%{opacity:.25}50%{opacity:.95}}
  .grain{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.05;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
    background-size:140px 140px}
  .vignette{position:fixed;inset:0;z-index:3;pointer-events:none;
    background:radial-gradient(120% 96% at 50% 46%, transparent 52%, oklch(0.05 0.01 265 / .78) 100%)}

  /* ================= 顶栏 ================= */
  .topbar{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;align-items:center;gap:14px;
    padding:20px 26px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:590;font-size:15px;letter-spacing:.02em}
  .brand .mark{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;
    background:oklch(1 0 0 / .05);border:1px solid var(--border)}
  .brand .zh{font-family:var(--font-display);font-weight:700;font-size:16px;letter-spacing:.1em}
  .brand .en{color:var(--muted);font-size:11.5px;letter-spacing:.16em;padding-left:10px;
    border-left:1px solid var(--border)}
  .topnav{margin-left:auto;display:flex;align-items:center;gap:6px}
  .topnav a{min-height:44px;padding:0 13px;border-radius:var(--r-sm);color:var(--muted);font-size:13.5px;
    font-weight:510;letter-spacing:.02em;display:inline-flex;align-items:center;
    transition:color .15s var(--ease),background .15s var(--ease)}
  .topnav a:hover{color:var(--fg);background:oklch(1 0 0 / .07)}
  .topnav a[aria-current="page"]{color:var(--fg);background:oklch(1 0 0 / .07)}

  /* 未上线的入口:保持可聚焦、可读屏,点击给出说明,不做假跳转 */
  .nav-soon{min-height:44px;padding:0 13px;border-radius:var(--r-sm);border:0;background:transparent;
    color:oklch(0.62 0.018 265);font-size:13.5px;font-weight:510;letter-spacing:.02em;
    display:inline-flex;align-items:center;gap:7px;
    transition:color .15s var(--ease),background .15s var(--ease)}
  .nav-soon:hover{color:var(--fg);background:oklch(1 0 0 / .07)}
  .nav-soon .tag{font-size:10px;letter-spacing:.1em;padding:2px 6px;border-radius:var(--r-pill);
    border:1px solid var(--border);color:var(--muted)}
  .toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,10px);z-index:80;
    max-width:min(420px,calc(100vw - 32px));padding:12px 18px;border-radius:var(--r-pill);
    font-size:13px;line-height:1.5;letter-spacing:.02em;text-align:center;
    background:oklch(0.17 0.026 265 / .97);border:1px solid var(--border-2);color:var(--fg);
    box-shadow:0 20px 50px -28px oklch(0.02 0 0 / .9);
    opacity:0;visibility:hidden;
    transition:opacity .22s var(--ease),transform .22s var(--ease),visibility .22s}
  .toast.on{opacity:1;visibility:visible;transform:translate(-50%,0)}
  /* 次级入口:不占暖金。整页唯一的实心主 CTA 是「走进这个世界」。 */
  .btn-create{margin-left:8px;height:44px;padding:0 17px;border-radius:var(--r-pill);
    border:1px solid var(--border-2);background:transparent;color:var(--fg);
    font-size:13.5px;font-weight:590;letter-spacing:.02em;text-decoration:none;
    display:inline-flex;align-items:center;gap:7px;
    transition:background .16s var(--ease),border-color .16s var(--ease)}
  .btn-create:hover{background:oklch(1 0 0 / .10);border-color:oklch(1 0 0 / .32)}

  /* ================= 宣言 ================= */
  .creed{position:fixed;left:34px;top:50%;transform:translateY(-50%);z-index:30;max-width:330px;
    pointer-events:none;transition:opacity .5s var(--ease),transform .5s var(--ease)}
  .creed .eyebrow{font-size:11px;letter-spacing:.26em;color:var(--muted);font-weight:590;margin-bottom:16px}
  .creed h1{font-family:var(--font-display);font-weight:900;font-size:clamp(30px,3.1vw,42px);
    line-height:1.34;letter-spacing:0}
  .creed blockquote{margin-top:20px;padding-left:14px;border-left:1px solid var(--border-2);
    font-family:var(--font-display);font-size:13.5px;line-height:1.95;color:var(--muted)}
  .creed blockquote cite{display:block;margin-top:8px;font-style:normal;font-size:12px;
    letter-spacing:.06em;color:oklch(0.58 0.02 265)}
  body.focusing .creed{opacity:0;transform:translateY(-50%) translateX(-24px)}

  /* ================= 3D 星系 ================= */
  .stage{position:fixed;inset:0;z-index:20;perspective:1250px;perspective-origin:50% 46%;
    cursor:grab;touch-action:none}
  .galaxy-state{position:fixed;inset:0;z-index:35;display:grid;place-items:center;padding:24px;
    background:oklch(0.09 0.018 265 / .72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .galaxy-state[hidden]{display:none}
  .state-panel{width:min(100%,360px);padding:26px 24px;border:1px solid var(--border-2);border-radius:var(--r-md);
    text-align:center;background:oklch(0.15 0.024 265 / .94);box-shadow:0 24px 70px -38px oklch(0.02 0 0 / .95)}
  .state-panel p{font-family:var(--font-display);font-size:17px;line-height:1.55}
  .state-panel small{display:block;margin-top:8px;color:var(--muted);font-size:12.5px;line-height:1.7}
  .state-retry{min-height:44px;margin-top:18px;padding:0 17px;border:1px solid var(--border-2);border-radius:var(--r-pill);
    background:transparent;color:var(--fg);font-size:13px;font-weight:590;letter-spacing:.02em;
    transition:background .15s var(--ease),border-color .15s var(--ease)}
  .state-retry:hover{background:oklch(1 0 0 / .10);border-color:oklch(1 0 0 / .32)}
  .stage.dragging{cursor:grabbing}
  .orbit{position:absolute;left:50%;top:46%;width:0;height:0;transform-style:preserve-3d;
    transition:opacity .5s var(--ease),filter .5s var(--ease)}
  body.focusing .orbit{opacity:.16;filter:blur(3px)}

  .work{position:absolute;width:var(--card-w);height:var(--card-h);margin-left:calc(var(--card-w)/-2);
    margin-top:calc(var(--card-h)/-2);border:0;background:transparent;overflow:visible;
    transform-style:preserve-3d;will-change:transform, opacity;opacity:0;
    transition:transform 1.05s var(--ease), opacity .62s var(--ease),box-shadow .3s var(--ease);
    box-shadow:0 0 0 0 transparent,0 24px 60px -30px oklch(0.02 0 0 / .9);
    display:block;padding:0;text-align:left}
  .work.in{opacity:1}
  .card-face{position:absolute;inset:0;overflow:hidden;border-radius:var(--r-lg);
    border:1px solid oklch(1 0 0 / .14);background:var(--bg);
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
    transition:border-color .3s var(--ease)}
  .card-back{transform:rotateY(180deg)}
  .work:hover{box-shadow:0 0 34px -4px var(--w-glow),0 24px 60px -30px oklch(0.02 0 0 / .9)}
  .work:hover .card-face{border-color:var(--w-line)}
  .work:focus-visible{box-shadow:var(--ring),0 24px 60px -30px oklch(0.02 0 0 / .9)}
  .work:focus-visible .card-face{border-color:var(--w-line)}

  /* Sky and silhouette inherit each card's local world hue. */
  .sky{position:absolute;inset:0;
    background:
      radial-gradient(120% 62% at 68% 8%, var(--w-halo), transparent 62%),
      linear-gradient(178deg, var(--w-sky-hi) 0%, var(--w-sky-md) 46%, var(--w-sky-lo) 100%)}
  .sky .cloud{position:absolute;border-radius:50%;filter:blur(7px);background:var(--w-cloud)}
  .sky .cloud.c1{width:150%;height:34%;left:-30%;bottom:8%}
  .sky .cloud.c2{width:110%;height:24%;left:22%;bottom:20%;background:var(--w-cloud2)}
  .sky .dot{position:absolute;width:1.6px;height:1.6px;border-radius:50%;background:var(--w-star)}
  .sky .streak{position:absolute;height:1px;
    background:linear-gradient(90deg,transparent,var(--w-star));
    transform:rotate(28deg);transform-origin:right center}
  .horizon{position:absolute;left:0;right:0;bottom:0;height:34%;
    background:linear-gradient(180deg, transparent, var(--w-ink) 62%)}
  .figure{position:absolute;left:50%;bottom:16%;width:46px;height:46px;margin-left:-23px;
    color:var(--w-ink)}
  .figure svg{width:100%;height:100%;display:block}

  .work .plate{position:absolute;left:0;right:0;bottom:0;padding:12px 13px 13px;
    background:linear-gradient(180deg,transparent,var(--w-plate) 42%)}
  .work .kicker{font-size:10.5px;font-weight:590;letter-spacing:.12em;
    color:var(--w-kick);margin-bottom:5px}
  .work .name{font-family:var(--font-display);font-weight:700;font-size:14.5px;line-height:1.4;
    color:var(--w-text)}

  /* ================= 排布切换 ================= */
  .dock{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:40;display:flex;
    align-items:center;gap:4px;padding:5px;border-radius:var(--r-pill);
    background:oklch(0.12 0.02 265 / .74);border:1px solid var(--border);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    transition:opacity .4s var(--ease),transform .4s var(--ease)}
  body.focusing .dock{opacity:0;transform:translateX(-50%) translateY(18px);pointer-events:none}
  .dock button{height:44px;padding:0 15px;border:0;border-radius:var(--r-pill);background:transparent;
    color:var(--muted);font-size:13px;font-weight:510;letter-spacing:.04em;
    transition:background .15s var(--ease),color .15s var(--ease)}
  .dock button:hover{color:var(--fg);background:oklch(1 0 0 / .08)}
  /* 选中态用中性亮态,不占暖金——首屏强调色配额留给宣言眉标与主 CTA */
  .dock button[aria-pressed="true"]{background:oklch(0.88 0.008 265);color:oklch(0.16 0.02 265);
    font-weight:590}
  .hint{position:fixed;right:26px;bottom:32px;z-index:40;color:oklch(0.56 0.015 265);
    font-size:11.5px;letter-spacing:.1em;pointer-events:none;transition:opacity .4s var(--ease)}
  body.focusing .hint{opacity:0}

  /* ================= 聚焦面板 ================= */
  .focusview{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
    gap:52px;padding:40px;opacity:0;visibility:hidden;transition:opacity .42s var(--ease),visibility .42s}
  body.focusing .focusview{opacity:1;visibility:visible}
  .fcard{width:286px;height:384px;flex:none;border-radius:22px;overflow:hidden;position:relative;
    border:1px solid oklch(1 0 0 / .16);
    box-shadow:0 0 90px -14px var(--w-glow-lg), 0 40px 90px -40px oklch(0.02 0 0 / .95);
    transform:scale(.93) translateY(10px);transition:transform .48s var(--ease)}
  body.focusing .fcard{transform:none}
  .fcard .figure{width:78px;height:78px;margin-left:-39px;bottom:17%}
  .fcard .plate{padding:18px 20px 20px}
  .fcard .kicker{font-size:11px;letter-spacing:.18em;margin-bottom:7px}
  .fcard .name{font-size:23px;line-height:1.36}

  .fmeta{max-width:400px;transform:translateY(14px);opacity:0;
    transition:transform .5s .1s var(--ease),opacity .5s .1s var(--ease)}
  body.focusing .fmeta{transform:none;opacity:1}
  .fmeta .tagline{font-family:var(--font-display);font-size:19px;line-height:1.8;color:var(--fg)}
  .fmeta .world{margin-top:16px;font-family:var(--font-display);font-size:14px;line-height:1.95;
    color:var(--muted);max-width:44ch}
  .fmeta .attrs{display:flex;flex-wrap:wrap;gap:7px;margin-top:20px}
  .fmeta .attrs span{font-size:11.5px;letter-spacing:.03em;padding:5px 11px;border-radius:var(--r-pill);
    border:1px solid var(--border);color:var(--muted);background:oklch(1 0 0 / .04)}
  .facts{display:flex;align-items:center;gap:14px;margin-top:30px}
  .btn-enter{height:50px;padding:0 26px;border-radius:var(--r-pill);border:0;
    background:var(--accent);color:oklch(0.16 0.03 85);font-size:15px;font-weight:590;letter-spacing:.03em;
    display:inline-flex;align-items:center;gap:9px;transition:background .16s var(--ease),transform .1s}
  .btn-enter:hover{background:oklch(0.90 0.135 85)}
  .btn-enter:active{transform:translateY(1px)}
  .btn-back{min-height:44px;background:none;border:0;color:var(--muted);font-size:13.5px;letter-spacing:.03em;
    padding:0 4px;transition:color .15s var(--ease)}
  .btn-back:hover{color:var(--fg)}
  @media(max-width:900px){
    .focusview{flex-direction:column;gap:26px;padding:26px;overflow:auto}
    .fcard{width:216px;height:290px}
    .fmeta .tagline{font-size:17px}
    .fmeta .world{font-size:13.5px;line-height:1.9}
    .facts{margin-top:22px}
    /* 821–900px:星系仍是 3D,卡片会扫到左栏,宣言必须让位 */
    .creed{display:none}
  }

  /* ================= 窄屏:3D 星系降级为 2D 天空墙 =================
     手机上要拖一个 12 张卡的球体才能点中目标,既难命中又费电。
     小屏改成可滚动的双列天空墙:同一套 hue 天空 + 剪影,
     交互回到最朴素的「点开一张卡」。宣言重排为页头,不是删掉。 */
  @media(max-width:820px){
    html,body{overflow:visible;height:auto}
    body.flat.focusing{overflow:hidden}
    .flat .stage{position:relative;inset:auto;perspective:none;cursor:default;
      touch-action:auto;padding:26px 16px 44px}
    .flat .orbit{position:static;left:auto;top:auto;width:auto;height:auto;
      transform:none!important;transform-style:flat;filter:none;
      display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
    .flat.focusing .orbit{opacity:.16;filter:blur(3px)}
    .flat .work{position:static;width:auto;height:auto;aspect-ratio:170/228;margin:0;
      transform:none!important;transition-delay:0ms!important;
      transition:opacity .5s var(--ease),box-shadow .3s var(--ease),border-color .3s var(--ease)}
    /* 顶栏是 fixed 62px:天空墙下宣言自己让出这段高度 */
    .flat .creed{display:block;position:static;transform:none!important;max-width:none;
      pointer-events:auto;margin:0;padding:84px 16px 0}
    .flat .creed h1{font-size:clamp(26px,7.4vw,36px)}
    .flat .creed blockquote{margin-top:16px;font-size:12.5px;line-height:1.85}
    .flat .dock{display:none}
    .flat .hint{position:static;text-align:center;margin-top:24px;padding:0 16px 8px;
      opacity:1;transform:none}
    .flat.focusing .hint{opacity:0}
    .topbar{padding:14px 16px;gap:8px}
    .brand .en{display:none}
    .topnav{gap:2px}
    /* 触摸目标 44px:顶栏在手机上是唯一的导航,不能靠精准点击 */
    .topnav a,.nav-soon{padding:0 9px;min-height:44px;display:inline-flex;align-items:center;
      font-size:12.5px}
    .nav-soon .tag{display:none}
    .btn-create{margin-left:4px;height:44px;padding:0 14px;font-size:12.5px}
    .toast{bottom:24px}
  }
  @media(max-width:560px){
    .topnav .nav-soon{display:none}
    .btn-create{width:44px;padding:0;justify-content:center}
    .btn-create .label{display:none}
  }
  @media(max-width:380px){
    .flat .orbit{grid-template-columns:minmax(0,1fr)}
  }

  /* ================= 开屏 ================= */
  .intro{position:fixed;inset:0;z-index:100;background:oklch(0.055 0.012 265);
    display:grid;place-items:center}
  .intro.gone{opacity:0;visibility:hidden;transition:opacity .7s var(--ease),visibility .7s}
  .intro svg{width:min(58vmin,330px);height:min(58vmin,330px);overflow:visible}
  .intro .ln{fill:none;stroke:oklch(0.86 0.10 85);stroke-width:1.6;stroke-linecap:round;
    stroke-dasharray:100;stroke-dashoffset:100;animation:draw .42s var(--ease) forwards}
  .intro .seed{fill:oklch(0.95 0.10 85);opacity:0;transform-box:fill-box;transform-origin:center;
    will-change:transform,opacity;animation:seedIn .5s var(--ease) forwards}
  .intro .st{fill:oklch(0.97 0.06 85);opacity:0;transform-box:fill-box;transform-origin:center;
    animation:starPop .5s var(--ease) forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes seedIn{0%{opacity:0;transform:scale(.2)}60%{opacity:1;transform:scale(1.5)}100%{opacity:1;transform:scale(1)}}

<script src="assets/works-data.js"></script>
<script>
(function(){
  'use strict';
  var RM = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var INTRO_SEEN_KEY = 'wanxiang-intro-seen-v1';

  /* ---------------- 作品数据:每部作品一个 hue ---------------- */
  var WORKS = window.WANXIANG_WORKS || [];

  /* ---------------- 剪影(SVG,人小天大) ---------------- */
  function figure(type){
    var head='<circle cx="50" cy="14" r="7.4"/>';
    var torso='<path d="M50 22c-5.4 0-9.4 3.6-10.1 8.7l-1.7 12.9c-.3 2.3 1.5 4.2 3.8 4.2h16c2.3 0 4.1-1.9 3.8-4.2l-1.7-12.9C59.4 25.6 55.4 22 50 22z"/>';
    var legs='<path d="M45.6 47 43.6 80" stroke-width="6" stroke-linecap="round" fill="none"/>'+
             '<path d="M54.4 47 56.4 80" stroke-width="6" stroke-linecap="round" fill="none"/>';
    var arms='';
    if(type==='gaze'){
      head='<circle cx="49" cy="13" r="7.4"/>';
      arms='<path d="M41 30 35 49" stroke-width="5" stroke-linecap="round" fill="none"/>'+
           '<path d="M59 30 66 47" stroke-width="5" stroke-linecap="round" fill="none"/>';
    }else if(type==='radio'){
      arms='<path d="M41 30 36 50" stroke-width="5" stroke-linecap="round" fill="none"/>'+
           '<path d="M59 31 64 38 57 23" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>'+
           '<rect x="53" y="15" width="6" height="9" rx="1.4"/>';
    }else if(type==='blade'){
      arms='<path d="M41 30 36 50" stroke-width="5" stroke-linecap="round" fill="none"/>'+
           '<path d="M59 30 64 50" stroke-width="5" stroke-linecap="round" fill="none"/>'+
           '<path d="M64 52 72 16" stroke-width="2.6" stroke-linecap="round" fill="none"/>';
    }else if(type==='umbrella'){
      arms='<path d="M41 30 36 50" stroke-width="5" stroke-linecap="round" fill="none"/>'+
           '<path d="M59 30 63 19" stroke-width="5" stroke-linecap="round" fill="none"/>'+
           '<path d="M63 19 63 8" stroke-width="2.2" stroke-linecap="round" fill="none"/>'+
           '<path d="M47 12q16-13 32 0z"/>';
    }else if(type==='reach'){
      arms='<path d="M41 30 29 19" stroke-width="5" stroke-linecap="round" fill="none"/>'+
           '<path d="M59 30 71 19" stroke-width="5" stroke-linecap="round" fill="none"/>';
    }else{ /* walk */
      legs='<path d="M45.6 47 40 79" stroke-width="6" stroke-linecap="round" fill="none"/>'+
           '<path d="M54.4 47 61 78" stroke-width="6" stroke-linecap="round" fill="none"/>';
      arms='<path d="M41 30 45 49" stroke-width="5" stroke-linecap="round" fill="none"/>'+
           '<path d="M59 30 55 49" stroke-width="5" stroke-linecap="round" fill="none"/>';
    }
    return '<svg viewBox="0 0 100 92" aria-hidden="true"><g fill="currentColor" stroke="currentColor">'
      + head + torso + legs + arms + '</g></svg>';
  }

  /* ---------------- 卡片内容 ---------------- */
  function skyHTML(w, big){
    var dots='', i, seed = w.h;
    var count = big ? 26 : 14;
    for(i=0;i<count;i++){
      var x = ((seed*(i+3)*37) % 97) + 1;
      var y = ((seed*(i+7)*19) % 52) + 2;
      var o = 0.35 + (((seed*(i+5)) % 60)/100);
      dots += '<span class="dot" style="left:'+x+'%;top:'+y+'%;opacity:'+o.toFixed(2)+'"></span>';
    }
    var streak = '<span class="streak" style="left:'+(big?18:14)+'%;top:'+(big?15:13)+'%;width:'+(big?70:46)+'px"></span>';
    var scene = '<span class="sky">'+dots+streak+
      '<span class="cloud c1"></span><span class="cloud c2"></span></span>'+
      '<span class="horizon"></span>'+
      '<span class="figure">'+figure(w.f)+'</span>'+
      '<span class="plate"><span class="kicker">'+w.k+'</span><span class="name"'+(big ? ' id="f-name"' : '')+'>'+w.n+'</span></span>';
    if(big) return scene;
    return '<span class="card-face card-front">'+scene+'</span>'+
      '<span class="card-face card-back" aria-hidden="true">'+scene+'</span>';
  }

  /* ---------------- 建卡与状态 ---------------- */
  var orbit = document.getElementById('orbit');
  var stageState = document.getElementById('galaxy-state');
  var cards = [];
  function setGalaxyState(type){
    stageState.hidden = !type;
    document.getElementById('stage').setAttribute('aria-busy', String(type === 'loading'));
    if(!type){ stageState.textContent = ''; return; }
    if(type === 'loading'){
      stageState.innerHTML = '<div class="state-panel"><p>星海正在展开</p><small>正在整理可进入的世界。</small></div>';
    }else if(type === 'empty'){
      stageState.innerHTML = '<div class="state-panel"><p>此刻还没有可进入的世界</p><small>作品准备好后，会在这片星海里出现。</small></div>';
    }else{
      stageState.innerHTML = '<div class="state-panel"><p>星海暂时没有回应</p><small>请重新尝试加载作品。</small><button class="state-retry" type="button" data-od-id="cta-retry-galaxy">重新尝试</button></div>';
      stageState.querySelector('.state-retry').addEventListener('click', buildCards);
    }
  }
  function buildCards(){
    setGalaxyState('loading');
    orbit.textContent = '';
    cards = [];
    try{
      if(!Array.isArray(WORKS)) throw new Error('Story data unavailable');
      if(!WORKS.length){ setGalaxyState('empty'); return; }
      cards = WORKS.map(function(w, i){
        var el = document.createElement('button');
        el.className = 'work world-scope';
        el.type = 'button';
        el.style.setProperty('--hue', w.h);
        el.setAttribute('data-od-id', 'work-card-' + (i+1));
        el.setAttribute('aria-label', '打开作品：' + w.n + '，' + w.k);
        el.innerHTML = skyHTML(w, false);
        el.addEventListener('click', function(){ focusWork(i); });
        orbit.appendChild(el);
        return el;
      });
      setGalaxyState('');
      if(intro && intro.classList.contains('gone')) revealCards();
    }catch(error){
      setGalaxyState('error');
    }
  }
  buildCards();

  /* ---------------- 四种排布 ---------------- */
  var N = WORKS.length;
  function layoutSphere(){
    var R = 400, out = [];
    for(var i=0;i<N;i++){
      var y = 1 - (i/(N-1))*2;           // 1 → -1
      var r = Math.sqrt(Math.max(0,1-y*y));
      var phi = i * Math.PI * (3 - Math.sqrt(5));
      var x = Math.cos(phi)*r, z = Math.sin(phi)*r;
      out.push({x:x*R, y:-y*R*0.78, z:z*R,
        ry: Math.atan2(x, z)*180/Math.PI,
        rx: Math.asin(Math.max(-1,Math.min(1,y)))*180/Math.PI*0.7});
    }
    return out;
  }
  function layoutHelix(){
    var R = 330, out = [];
    for(var i=0;i<N;i++){
      var a = i * 32;
      out.push({x: Math.sin(a*Math.PI/180)*R, y: (i-(N-1)/2)*52, z: Math.cos(a*Math.PI/180)*R,
        ry: a, rx: 0});
    }
    return out;
  }
  function layoutGrid(){
    var cols = 4, out = [], gx = 214, gy = 268;
    for(var i=0;i<N;i++){
      var c = i % cols, r = Math.floor(i/cols);
      out.push({x:(c-(cols-1)/2)*gx, y:(r-1)*gy, z:0, ry:0, rx:0});
    }
    return out;
  }
  function layoutChaos(){
    var out = [], s = 9301;
    function rnd(){ s = (s*9301 + 49297) % 233280; return s/233280; }
    for(var i=0;i<N;i++){
      out.push({x:(rnd()-.5)*940, y:(rnd()-.5)*560, z:(rnd()-.5)*880,
        ry:(rnd()-.5)*60, rx:(rnd()-.5)*26});
    }
    return out;
  }
  var LAYOUTS = {sphere:layoutSphere, helix:layoutHelix, grid:layoutGrid, chaos:layoutChaos};
  var positions = [];
  var current = 'sphere';
  /* ≤820px:星系降级为 2D 天空墙(见同名 CSS 段的理由) */
  var FLAT = window.matchMedia('(max-width:820px)');

  function applyLayout(name){
    current = name;
    if(FLAT.matches) return;      /* 天空墙由 CSS grid 排,不写 transform */
    positions = LAYOUTS[name]();
    cards.forEach(function(el, i){
      var p = positions[i];
      el.style.transitionDelay = (RM ? 0 : i*38) + 'ms';
      el.style.transform = 'translate3d('+p.x.toFixed(1)+'px,'+p.y.toFixed(1)+'px,'+p.z.toFixed(1)+'px)'
        + ' rotateY('+p.ry.toFixed(1)+'deg) rotateX('+p.rx.toFixed(1)+'deg)';
    });
  }

  document.querySelectorAll('.dock button').forEach(function(b){
    b.addEventListener('click', function(){
      document.querySelectorAll('.dock button').forEach(function(x){
        x.setAttribute('aria-pressed', String(x === b));
      });
      applyLayout(b.dataset.layout);
    });
  });

  /* ---------------- 旋转 / 拖拽 / 缩放 ---------------- */
  var spin = 0, tSpin = 0, tilt = -6, tTilt = -6, dist = 0, tDist = 0;
  var dragging = false, lx = 0, ly = 0, auto = true;
  var stage = document.getElementById('stage');

  stage.addEventListener('pointerdown', function(e){
    if(FLAT.matches) return;                 /* 天空墙下不劫持触摸,留给页面滚动 */
    if(e.target.closest('.work')) return;
    dragging = true; auto = false; lx = e.clientX; ly = e.clientY;
    stage.classList.add('dragging');
    stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener('pointermove', function(e){
    if(!dragging) return;
    tSpin += (e.clientX - lx) * 0.28;
    tTilt = Math.max(-58, Math.min(58, tTilt - (e.clientY - ly) * 0.18));
    lx = e.clientX; ly = e.clientY;
  });
  function endDrag(){ dragging = false; stage.classList.remove('dragging'); }
  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointercancel', endDrag);
  stage.addEventListener('wheel', function(e){
    if(FLAT.matches) return;                 /* 天空墙下滚轮 = 翻页,不能拦 */
    e.preventDefault();
    tDist = Math.max(-560, Math.min(340, tDist - e.deltaY * 0.6));
  }, {passive:false});

  function loop(){
    if(FLAT.matches){ requestAnimationFrame(loop); return; }
    if(auto && !dragging && !document.body.classList.contains('focusing')) tSpin += 0.055;
    spin += (tSpin - spin) * 0.075;
    tilt += (tTilt - tilt) * 0.09;
    dist += (tDist - dist) * 0.09;
    orbit.style.transform = 'translateZ('+dist.toFixed(1)+'px) rotateX('+tilt.toFixed(2)+'deg) rotateY('+spin.toFixed(2)+'deg)';
    requestAnimationFrame(loop);
  }

  /* ---------------- 聚焦 ---------------- */
  var fcard = document.getElementById('fcard');
  var focusView = document.getElementById('focusview');
  var lastFocused = null;

  function focusWork(i){
    var w = WORKS[i];
    lastFocused = cards[i];
    fcard.className = 'fcard world-scope';
    fcard.style.setProperty('--hue', w.h);
    /* 整片深空过渡到这个世界的色相——「穿过一个宇宙」 */
    document.documentElement.style.setProperty('--ambient-hue', w.h);
    fcard.innerHTML = skyHTML(w, true);
    document.querySelector('.btn-enter').setAttribute('href', window.WANXIANG_WORK_LINK(w));
    document.getElementById('f-tagline').textContent = w.t;
    document.getElementById('f-world').textContent = w.w;
    document.getElementById('f-attrs').innerHTML =
      w.a.map(function(a){ return '<span>'+a+'</span>'; }).join('');
    // 星系朝该作品转过去,再浮出详情
    var p = positions[i];
    if(p){ tSpin = -p.ry; tTilt = Math.max(-40, Math.min(40, -p.rx)); }
    auto = false;
    document.querySelectorAll('.topbar,.creed,.stage,.dock').forEach(function(el){ el.inert = true; });
    document.body.classList.add('focusing');
    setTimeout(function(){ document.querySelector('.btn-enter').focus(); }, RM ? 0 : 420);
  }
  function unfocus(){
    document.body.classList.remove('focusing');
    document.querySelectorAll('.topbar,.creed,.stage,.dock').forEach(function(el){ el.inert = false; });
    document.documentElement.style.setProperty('--ambient-hue', 252);
    auto = true;
    if(lastFocused) lastFocused.focus();
  }
  document.getElementById('btn-back').addEventListener('click', unfocus);
  focusView.addEventListener('click', function(e){ if(e.target === focusView) unfocus(); });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && document.body.classList.contains('focusing')) unfocus();
  });
  /* 浮层内焦点不外逃:Tab 在首尾之间回环 */
  focusView.addEventListener('keydown', function(e){
    if(e.key !== 'Tab') return;
    var f = focusView.querySelectorAll('a[href], button:not([disabled])');
    if(!f.length) return;
    var first = f[0], last = f[f.length - 1];
    if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  });

  /* ---------------- 未上线入口的说明 ---------------- */
  var toast = document.getElementById('toast'), toastT;
  function say(msg){
    toast.textContent = msg;
    toast.classList.add('on');
    clearTimeout(toastT);
    toastT = setTimeout(function(){ toast.classList.remove('on'); }, 3200);
  }
  document.querySelectorAll('[data-soon]').forEach(function(b){
    b.addEventListener('click', function(){ say(b.dataset.soon); });
  });

  /* ---------------- 星系 / 天空墙 切换 ---------------- */
  var hint = document.getElementById('hint');
  function setMode(){
    var flat = FLAT.matches;
    document.body.classList.toggle('flat', flat);
    hint.textContent = flat
      ? '点开一张卡片,走进那个世界'
      : '拖动旋转 · 滚轮远近 · 点击进入';
    if(flat){
      orbit.style.transform = '';
      cards.forEach(function(el){ el.style.transform = ''; el.style.transitionDelay = ''; });
    }else{
      applyLayout(current);
    }
  }
  FLAT.addEventListener('change', setMode);

  /* ---------------- 星点 ---------------- */
  (function(){
    var box = document.getElementById('stars'), html = '', i;
    for(i=0;i<150;i++){
      var s = Math.random() < 0.86 ? 1 : 2;
      var o = (0.16 + Math.random()*0.62).toFixed(2);
      var tw = (!RM && Math.random() < 0.22)
        ? 'animation:twinkle '+(3+Math.random()*4).toFixed(1)+'s ease-in-out infinite;animation-delay:'+(Math.random()*5).toFixed(1)+'s;'
        : '';
      html += '<i style="left:'+(Math.random()*100).toFixed(2)+'%;top:'+(Math.random()*100).toFixed(2)
           + '%;width:'+s+'px;height:'+s+'px;opacity:'+o+';'+tw+'"></i>';
    }
    box.innerHTML = html;
  })();

  /* ---------------- 开屏 ---------------- */
  var intro = document.getElementById('intro');
  var skipIntro = document.getElementById('skip');
  var introSeen = false;
  try{ introSeen = window.localStorage.getItem(INTRO_SEEN_KEY) === '1'; }catch(error){}
  function endIntro(){
    if(!intro || intro.classList.contains('gone')) return;
    var returnFocus = document.activeElement === skipIntro;
    try{ window.localStorage.setItem(INTRO_SEEN_KEY, '1'); }catch(error){}
    intro.classList.add('gone');
    revealCards();
    setTimeout(function(){
      if(intro && intro.parentNode) intro.parentNode.removeChild(intro);
      if(returnFocus) document.querySelector('.brand').focus();
    }, 800);
  }
  skipIntro.addEventListener('click', endIntro);
  if(RM || introSeen){ endIntro(); }
  else {
    skipIntro.focus();
    setTimeout(endIntro, 2650);
  }

  /* ---------------- 启动 ---------------- */
  setMode();
  applyLayout('sphere');
  // 入场:星群散开后卡片错峰浮现;结束即释放 will-change(避免长期占用合成层)
  function revealCards(){
    cards.forEach(function(el, i){
      setTimeout(function(){
        el.classList.add('in');
        setTimeout(function(){ el.style.willChange = 'auto'; }, 1200);
      }, RM ? 0 : i * 42);
    });
  }
  if(RM){
    orbit.style.transform = 'rotateX(-6deg)';
    revealCards();          // 减动效:开屏已跳过,直接呈现
  } else {
    requestAnimationFrame(loop);   // 卡片由 endIntro() 触发浮现,与星群散开衔接
  }
})();
</script>
</body>
</html>
