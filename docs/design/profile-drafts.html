<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="草稿箱 · 还没写完的天空。每一份草稿缺哪一层,缩略图上就少哪一层。" />
<title>草稿箱 · 万象 Story Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;510;590&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:        oklch(0.13 0.022 265);
    --bg-deep:   oklch(0.09 0.018 265);
    --surface:   oklch(0.19 0.030 265);
    --fg:        oklch(0.96 0.010 90);
    --muted:     oklch(0.72 0.020 265);
    --border:    oklch(1 0 0 / 0.11);
    --border-2:  oklch(1 0 0 / 0.20);
    --accent:    oklch(0.82 0.125 85);
    --accent-dim:oklch(0.66 0.100 85);
    --bright:    oklch(0.88 0.008 265);

    --font-display:"Noto Serif SC", Georgia, "Songti SC", serif;
    --font-ui:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;

    --r-sm:8px; --r-md:12px; --r-lg:18px; --r-pill:999px;
    --ease:cubic-bezier(.2,0,0,1);
    --ring:0 0 0 2px oklch(0.09 0.018 265), 0 0 0 4px oklch(0.82 0.125 85);
    --ambient-hue:252;
  }
  .world-scope{
    --w-line:   oklch(0.72 0.140 var(--hue) / .85);
    --w-glow:   oklch(0.72 0.140 var(--hue) / .50);
    --w-sky-hi: oklch(0.34 0.115 var(--hue));
    --w-sky-md: oklch(0.22 0.085 var(--hue));
    --w-sky-lo: oklch(0.11 0.040 var(--hue));
    --w-halo:   oklch(0.48 0.130 var(--hue) / .75);
    --w-cloud:  oklch(0.20 0.050 var(--hue) / .85);
    --w-cloud2: oklch(0.44 0.090 var(--hue) / .50);
    --w-star:   oklch(0.98 0.020 var(--hue) / .90);
    --w-ink:    oklch(0.055 0.015 var(--hue));
    --w-plate:  oklch(0.050 0.015 var(--hue) / .92);
    --w-text:   oklch(0.97 0.010 var(--hue));
    --w-kick:   oklch(0.86 0.090 var(--hue));
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg-deep);color:var(--fg);font-family:var(--font-ui);
    -webkit-font-smoothing:antialiased;min-height:100%}
  button{font-family:inherit;cursor:pointer;color:inherit}
  a{color:inherit;text-decoration:none}
  button:disabled{cursor:not-allowed}
  :focus-visible{outline:none;box-shadow:var(--ring);border-radius:var(--r-sm)}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
  [hidden]{display:none!important}

  .space{position:fixed;inset:0;z-index:0;
    background:
      radial-gradient(58% 46% at 74% 12%, oklch(0.30 0.075 var(--ambient-hue) / .40), transparent 62%),
      radial-gradient(46% 34% at 14% 86%, oklch(0.28 0.070 calc(var(--ambient-hue) + 52) / .26), transparent 66%),
      radial-gradient(70% 60% at 50% 46%, oklch(0.16 0.028 var(--ambient-hue)), oklch(0.08 0.016 var(--ambient-hue)) 78%);
    transition:background 1.1s var(--ease)}
  .stars{position:fixed;inset:0;z-index:1;pointer-events:none}
  .stars i{position:absolute;border-radius:50%;background:oklch(1 0 0);display:block}
  @keyframes twinkle{0%,100%{opacity:.25}50%{opacity:.95}}
  .grain{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.05;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
    background-size:140px 140px}
  .vignette{position:fixed;inset:0;z-index:3;pointer-events:none;
    background:radial-gradient(126% 100% at 50% 40%, transparent 56%, oklch(0.05 0.01 265 / .70) 100%)}

  /* ================= 顶栏 ================= */
  .topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;
    padding:16px 26px;background:linear-gradient(180deg, oklch(0.09 0.018 265 / .94), oklch(0.09 0.018 265 / 0));
    backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px)}
  .brand{display:flex;align-items:center;gap:10px;font-weight:590;font-size:15px;letter-spacing:.02em}
  .brand .mark{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;
    background:oklch(1 0 0 / .05);border:1px solid var(--border)}
  .brand .zh{font-family:var(--font-display);font-weight:700;font-size:16px;letter-spacing:.1em}
  .brand .en{color:var(--muted);font-size:11.5px;letter-spacing:.16em;padding-left:10px;
    border-left:1px solid var(--border)}
  .topnav{margin-left:auto;display:flex;align-items:center;gap:6px}
  .topnav a{min-height:44px;padding:0 13px;border-radius:var(--r-sm);color:var(--muted);font-size:13.5px;
    font-weight:510;letter-spacing:.02em;display:inline-flex;align-items:center;
    transition:color .15s var(--ease),background .15s var(--ease)}
  .topnav a:hover{color:var(--fg);background:oklch(1 0 0 / .07)}
  .topnav a[aria-current]{color:var(--fg);background:oklch(1 0 0 / .07)}
  .btn-create{margin-left:8px;height:44px;padding:0 17px;border-radius:var(--r-pill);
    border:1px solid var(--border-2);background:transparent;color:var(--fg);
    font-size:13.5px;font-weight:590;letter-spacing:.02em;display:inline-flex;align-items:center;gap:7px;
    transition:background .16s var(--ease),border-color .16s var(--ease)}
  .btn-create:hover{background:oklch(1 0 0 / .10);border-color:oklch(1 0 0 / .32)}

  .wrap{position:relative;z-index:10;max-width:960px;margin:0 auto;padding:8px 26px 96px}

  /* ================= 空间内导航 ================= */
  .subnav{display:flex;align-items:center;gap:4px;padding:5px;border-radius:var(--r-pill);
    background:oklch(0.12 0.02 265 / .7);border:1px solid var(--border);width:max-content;max-width:100%;
    overflow-x:auto;scrollbar-width:none;margin-bottom:34px}
  .subnav::-webkit-scrollbar{display:none}
  .subnav a{white-space:nowrap;min-height:44px;padding:0 17px;border-radius:var(--r-pill);
    color:var(--muted);font-size:13.5px;font-weight:510;letter-spacing:.03em;
    display:inline-flex;align-items:center;gap:8px;
    transition:background .15s var(--ease),color .15s var(--ease)}
  .subnav a:hover{color:var(--fg);background:oklch(1 0 0 / .08)}
  .subnav a[aria-current="page"]{background:var(--bright);color:oklch(0.16 0.02 265);font-weight:590}
  .subnav .n{font-size:11.5px;font-variant-numeric:tabular-nums;opacity:.72}

  /* ================= 页头 ================= */
  .head{margin-bottom:30px}
  .head .eyebrow{font-size:11px;letter-spacing:.26em;color:var(--muted);font-weight:590;margin-bottom:14px}
  .head h1{font-family:var(--font-display);font-weight:900;font-size:clamp(28px,3.6vw,40px);
    line-height:1.36;letter-spacing:0;max-width:18ch}
  .head .lead{margin-top:16px;font-family:var(--font-display);font-size:14.5px;line-height:1.95;
    color:var(--muted);max-width:56ch}

  /* ================= 接着写(唯一实心暖金) ================= */
  .resume{position:relative;display:flex;align-items:center;gap:24px;padding:22px;margin-bottom:34px;
    border-radius:var(--r-lg);border:1px solid var(--border-2);background:oklch(1 0 0 / .04);
    overflow:hidden;flex-wrap:wrap}
  .resume .glow{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(58% 130% at 88% 10%, var(--w-glow), transparent 66%);opacity:.5}
  .resume .body{position:relative;flex:1 1 300px;min-width:0}
  .resume .eyebrow{font-size:10.5px;letter-spacing:.22em;color:var(--muted);font-weight:590;margin-bottom:9px}
  .resume h2{font-family:var(--font-display);font-weight:700;font-size:21px;line-height:1.5;letter-spacing:0}
  .resume .where{margin-top:9px;font-size:12.5px;line-height:1.85;color:var(--muted)}
  .resume .act{position:relative;flex:0 0 auto}
  .btn-primary{height:48px;padding:0 24px;border-radius:var(--r-pill);border:0;
    background:var(--accent);color:oklch(0.16 0.03 85);font-size:14.5px;font-weight:590;letter-spacing:.03em;
    display:inline-flex;align-items:center;gap:9px;
    transition:background .16s var(--ease),transform .1s var(--ease)}
  .btn-primary:hover{background:oklch(0.90 0.135 85)}
  .btn-primary:active{transform:translateY(1px)}
  .btn-ghost{min-height:44px;padding:0 17px;border-radius:var(--r-pill);border:1px solid var(--border-2);
    background:transparent;color:var(--fg);font-size:13.5px;font-weight:590;letter-spacing:.02em;
    display:inline-flex;align-items:center;gap:8px;
    transition:background .16s var(--ease),border-color .16s var(--ease)}
  .btn-ghost:hover{background:oklch(1 0 0 / .10);border-color:oklch(1 0 0 / .32)}

  /* ================= 草稿列表 ================= */
  .listhead{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:16px;
    flex-wrap:wrap}
  .listhead h2{font-family:var(--font-display);font-weight:700;font-size:18px;letter-spacing:0;line-height:1.5}
  .listhead .count{font-size:12.5px;letter-spacing:.04em;color:var(--muted);font-variant-numeric:tabular-nums}
  .list{display:flex;flex-direction:column;gap:14px}
  .draft{position:relative;display:flex;align-items:stretch;gap:20px;padding:16px;
    border-radius:var(--r-md);border:1px solid var(--border);background:oklch(1 0 0 / .03);
    transition:background .16s var(--ease),border-color .16s var(--ease)}
  .draft:hover{background:oklch(1 0 0 / .075);border-color:var(--w-line)}
  .draft:focus-within{border-color:var(--w-line)}

  /* 缩略天空:缺哪一层就真的没有那一层 */
  .mini{flex:none;width:150px;border-radius:var(--r-sm);overflow:hidden;position:relative;
    aspect-ratio:4/3;background:oklch(0.075 0.014 265);border:1px solid oklch(1 0 0 / .12)}
  .mini .l-sky{position:absolute;inset:0;
    background:radial-gradient(120% 66% at 66% 6%, var(--w-halo), transparent 64%),
      linear-gradient(178deg, var(--w-sky-hi), var(--w-sky-md) 52%, var(--w-sky-lo))}
  .mini .l-dot{position:absolute;width:1.6px;height:1.6px;border-radius:50%;background:var(--w-star)}
  .mini .l-attr{position:absolute;width:3.4px;height:3.4px;border-radius:50%;background:oklch(1 0 0 / .95);
    box-shadow:0 0 7px 1px var(--w-glow)}
  .mini .l-cloud{position:absolute;border-radius:50%;filter:blur(6px);background:var(--w-cloud)}
  .mini .l-cloud.c1{width:150%;height:30%;left:-26%;bottom:12%}
  .mini .l-cloud.c2{width:104%;height:22%;left:20%;bottom:24%;background:var(--w-cloud2)}
  .mini .l-streak{position:absolute;height:1px;left:14%;top:16%;width:44px;
    background:linear-gradient(90deg,transparent,var(--w-star));transform:rotate(26deg);transform-origin:right center}
  .mini .l-horizon{position:absolute;left:0;right:0;bottom:0;height:36%;
    background:linear-gradient(180deg,transparent,var(--w-ink) 66%)}
  .mini .l-fig{position:absolute;left:50%;bottom:14%;width:34px;height:34px;margin-left:-17px;color:var(--w-ink)}
  .mini .l-fig svg{width:100%;height:100%;display:block}
  .mini .dark{position:absolute;inset:0;display:grid;place-items:center;
    font-size:10.5px;letter-spacing:.16em;color:oklch(0.52 0.014 265)}

  .draft .meta{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
  .draft .title{font-family:var(--font-display);font-weight:700;font-size:17px;line-height:1.5;letter-spacing:0}
  .draft .hook{margin-top:8px;font-family:var(--font-display);font-size:13.5px;line-height:1.9;
    color:oklch(0.82 0.012 265);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .draft .sub{margin-top:auto;padding-top:14px;font-size:11.5px;letter-spacing:.04em;color:var(--muted);
    font-variant-numeric:tabular-nums}

  /* 六层轨:段与层一一对应,与 create-editor.html 的判定同源 */
  .trail{display:flex;flex-wrap:wrap;gap:6px;margin-top:13px}
  .trail span{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:var(--r-pill);
    font-size:11px;letter-spacing:.04em;border:1px solid var(--border);color:oklch(0.60 0.016 265)}
  .trail span::before{content:"";width:5px;height:5px;border-radius:50%;
    background:transparent;border:1px solid oklch(0.52 0.014 265)}
  .trail span.on{color:oklch(0.92 0.008 265);border-color:oklch(1 0 0 / .28)}
  .trail span.on::before{background:var(--bright);border-color:var(--bright)}

  .draft .tools{flex:none;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;gap:12px}
  .icon-btn{position:relative;z-index:2;width:44px;height:44px;display:grid;place-items:center;border-radius:var(--r-sm);
    border:1px solid transparent;background:transparent;color:var(--muted);
    transition:background .15s var(--ease),color .15s var(--ease),border-color .15s var(--ease)}
  .icon-btn:hover{background:oklch(1 0 0 / .10);color:var(--fg);border-color:var(--border-2)}
  .draft .open{position:relative;z-index:2;min-height:44px;padding:0 15px;border-radius:var(--r-pill);
    border:1px solid var(--border-2);font-size:13px;font-weight:590;letter-spacing:.02em;
    display:inline-flex;align-items:center;gap:7px;white-space:nowrap;
    transition:background .16s var(--ease),border-color .16s var(--ease)}
  .draft .open:hover{background:oklch(1 0 0 / .12);border-color:oklch(1 0 0 / .34)}

  .local{display:inline-flex;align-items:center;gap:6px;margin-left:9px;padding:3px 9px;border-radius:var(--r-pill);
    font-size:10.5px;letter-spacing:.08em;font-weight:590;
    border:1px solid oklch(1 0 0 / .24);color:oklch(0.92 0.008 265);background:oklch(1 0 0 / .06)}

  .empty{border:1px dashed var(--border-2);border-radius:var(--r-md);padding:44px 26px;text-align:center}
  .empty p{font-family:var(--font-display);font-size:17px;line-height:1.7}
  .empty small{display:block;margin-top:10px;color:var(--muted);font-size:12.5px;line-height:1.85;
    max-width:40ch;margin-left:auto;margin-right:auto}
  .empty .btn-ghost{margin-top:22px}

  .note{margin-top:34px;padding:16px 18px;border-radius:var(--r-md);border:1px solid var(--border);
    background:oklch(1 0 0 / .025);font-size:12.5px;line-height:1.9;color:var(--muted)}
  .note b{color:oklch(0.88 0.008 265);font-weight:590}

  /* ================= 删除确认 ================= */
  .scrim{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:24px;
    background:oklch(0.06 0.012 265 / .76);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .dialog{width:min(100%,420px);padding:26px;border-radius:var(--r-lg);border:1px solid var(--border-2);
    background:oklch(0.15 0.024 265 / .97);box-shadow:0 30px 80px -40px oklch(0.02 0 0 / .95)}
  .dialog h2{font-family:var(--font-display);font-weight:700;font-size:19px;line-height:1.5;letter-spacing:0}
  .dialog p{margin-top:12px;font-size:13.5px;line-height:1.9;color:var(--muted)}
  .dialog .row{display:flex;gap:10px;margin-top:24px;justify-content:flex-end;flex-wrap:wrap}
  /* 破坏性确认用中性亮态,不占暖金;暖金已给「接着写」 */
  .btn-danger{min-height:44px;padding:0 19px;border-radius:var(--r-pill);border:0;
    background:var(--bright);color:oklch(0.16 0.02 265);font-size:13.5px;font-weight:590;letter-spacing:.02em;
    transition:background .16s var(--ease)}
  .btn-danger:hover{background:oklch(0.96 0.006 265)}

  .toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,10px);z-index:80;
    max-width:min(430px,calc(100vw - 32px));padding:12px 18px;border-radius:var(--r-pill);
    font-size:13px;line-height:1.5;letter-spacing:.02em;text-align:center;
    background:oklch(0.17 0.026 265 / .97);border:1px solid var(--border-2);color:var(--fg);
    box-shadow:0 20px 50px -28px oklch(0.02 0 0 / .9);
    opacity:0;visibility:hidden;transition:opacity .22s var(--ease),transform .22s var(--ease),visibility .22s}
  .toast.on{opacity:1;visibility:visible;transform:translate(-50%,0)}

  @media(max-width:820px){
    .topbar{padding:12px 16px;gap:8px}
    .brand .en{display:none}
    .topnav{gap:2px}
    .topnav a{padding:0 9px;font-size:12.5px}
    .btn-create{margin-left:4px;height:44px;padding:0 14px;font-size:12.5px}
    .wrap{padding:8px 16px 80px}
    .resume{gap:18px}
    .resume .act{width:100%}
    .resume .act .btn-primary{width:100%;justify-content:center}
  }
  @media(max-width:640px){
    /* 小屏重新编排:缩略天空转到顶部整行,不是把三栏压扁 */
    .draft{flex-direction:column;gap:14px}
    .mini{width:100%;aspect-ratio:16/7}
    .draft .tools{flex-direction:row;align-items:center;justify-content:space-between;width:100%}
  }
  @media(max-width:560px){
    .topnav a[data-od-id="nav-history"],.topnav a[data-od-id="nav-works-library"]{display:none}
    .btn-create{width:44px;padding:0;justify-content:center}
    .btn-create .label{display:none}
  }

  @media (prefers-reduced-motion: reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
<div class="space" data-od-id="space-backdrop"></div>
<div class="stars" id="stars" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>

<header class="topbar" data-od-id="topbar">
  <a class="brand" href="home-galaxy.html" aria-label="万象 · Story Editor · 回到星海">
    <span class="mark" aria-hidden="true">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 19.5v-6M12 13.5 7.7 8.9M12 13.5l4.3-4.6"/>
        <circle cx="12" cy="20" r="1.3" fill="currentColor" stroke="none"/>
        <circle cx="7.4" cy="8.3" r="2.2" fill="var(--accent)" stroke="none"/>
        <circle cx="16.6" cy="8.3" r="2.2" fill="currentColor" stroke="none"/>
      </svg>
    </span>
    <span class="zh">万象</span>
    <span class="en">STORY EDITOR</span>
  </a>
  <nav class="topnav" aria-label="主导航" data-od-id="primary-navigation">
    <a href="home-galaxy.html" data-od-id="nav-galaxy">星海</a>
    <a href="works-library.html" data-od-id="nav-works-library">作品馆</a>
    <a href="reading-history.html" data-od-id="nav-history">历史记录</a>
    <a href="profile-space.html" aria-current="true" data-od-id="nav-my-space">我的空间</a>
    <a href="community.html" data-od-id="nav-community">社区</a>
  </nav>
  <a class="btn-create" href="create-editor.html" data-od-id="cta-create"
     aria-label="写一个世界 · 打开创作编辑器">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    <span class="label">写一个世界</span>
  </a>
</header>

<main class="wrap">
  <nav class="subnav" aria-label="我的空间" data-od-id="space-subnav">
    <a href="profile-space.html" data-od-id="sub-space">主页</a>
    <a href="profile-drafts.html" aria-current="page" data-od-id="sub-drafts">草稿箱 <span class="n" id="sub-n">3</span></a>
    <a href="profile-inbox.html" data-od-id="sub-inbox">消息 <span class="n">4</span></a>
    <a href="profile-settings.html" data-od-id="sub-settings">设置</a>
  </nav>

  <section class="head" data-od-id="drafts-head">
    <p class="eyebrow">草稿箱</p>
    <h1>还没写完的天空。</h1>
    <p class="lead">进度不是一条百分比。缺哪一段,缩略图上就真的少哪一层——地平线、渐变天空、属性星、剪影、云、流星,六层对应编辑器的六段。</p>
  </section>

  <!-- 接着写:整页唯一的实心暖金主动作 -->
  <section class="resume world-scope" id="resume" hidden data-od-id="resume-band">
    <span class="glow" aria-hidden="true"></span>
    <div class="body">
      <p class="eyebrow" id="resume-eyebrow">上次写到这里</p>
      <h2 id="resume-title"></h2>
      <p class="where" id="resume-where"></p>
    </div>
    <div class="act">
      <a class="btn-primary" href="create-editor.html" data-od-id="cta-resume">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4l10.5-10.5a2.1 2.1 0 0 0-3-3L5 17v3Z"/><path d="M14.5 6.5 17.5 9.5"/></svg>
        接着写
      </a>
    </div>
  </section>

  <section data-od-id="drafts-list-section">
    <div class="listhead">
      <h2>全部草稿</h2>
      <p class="count" id="count" role="status" aria-live="polite"></p>
    </div>
    <div class="list" id="list"></div>
  </section>

  <p class="note" data-od-id="drafts-note">
    草稿全量存在这台设备的浏览器里(键 <b>wanxiang-editor-draft-v1</b>),接后端前不会同步到其他设备,清理浏览器数据会一并清掉。
    编辑器目前只保留<b>一份</b>正在编辑的草稿,下面多于一条的部分是演示数据。
  </p>
</main>

<!-- 删除确认 -->
<div class="scrim" id="scrim" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-h" id="dialog" data-od-id="delete-dialog">
    <h2 id="dlg-h">删掉这片还没点亮的天空?</h2>
    <p id="dlg-p"></p>
    <div class="row">
      <button class="btn-ghost" type="button" id="dlg-cancel" data-od-id="cta-delete-cancel">留着</button>
      <button class="btn-danger" type="button" id="dlg-ok" data-od-id="cta-delete-confirm">删除草稿</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  'use strict';
  var RM = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var EDITOR_KEY = 'wanxiang-editor-draft-v1';   /* create-editor.html 的真实草稿 */
  var DEMO_KEY   = 'wanxiang-drafts-demo-v1';    /* 演示草稿的删除状态 */

  /* 主题注册表:与 create-editor.html / DESIGN.md §8 同一张表 */
  var THEMES = {
    star:  {h:252, f:'gaze'},   radio: {h:238, f:'radio'},
    ink:   {h:196, f:'umbrella'},xian: {h:168, f:'blade'},
    heal:  {h:132, f:'reach'},  horror:{h:96,  f:'walk'},
    sci:   {h:312, f:'walk'},   love:  {h:340, f:'gaze'}
  };
  function theme(id){ return THEMES[id] || THEMES.star; }

  var SEGS = ['灵感','世界观','属性','开场','天空','发布'];
  var LAYERS = ['地平线','渐变天空','属性星','剪影','云层','流星'];

  /* ---------------- 演示草稿:与编辑器 state 同构 ---------------- */
  function demoDraft(o){
    var base = {
      id:'', title:'', hook:'', tag:'',
      background:'', style:'', rules:'', outline:'', characters:[],
      attrs:[], opening:'', theme:'star', themeSet:false,
      cover:'', models:'', status:'draft', veil:0.74, at:'', local:false
    };
    for(var k in o){ if(Object.prototype.hasOwnProperty.call(o,k)) base[k] = o[k]; }
    return base;
  }
  var DEMO = [
    demoDraft({
      id:'d1', title:'雾港里没有灯塔', tag:'深海 · 异闻', theme:'ink', themeSet:true,
      hook:'船进港的那天起,再没有人见过灯塔亮起来。',
      background:'雾港封港的第十一天。海上起了终年不散的雾,所有靠岸的船都说,他们是循着一束根本不存在的光进来的。',
      style:'潮湿阴郁', rules:'玩家每次出海都会消耗一次「雾中的记忆」,归零后将无法认路。',
      attrs:[{name:'雾中的记忆',type:'number',init:'5',hidden:false,reveal:false},
             {name:'灯塔的真相',type:'scalar',init:'',hidden:true,reveal:false}],
      opening:'', at:'2 小时前'
    }),
    demoDraft({
      id:'d2', title:'把夏天留在第七天', tag:'夏日 · 奇谭', theme:'heal', themeSet:true,
      hook:'第七天结束时,日历会自己翻回第一天。',
      background:'小镇的八月被卡在同一个星期里。只有你记得上一轮发生过什么。',
      style:'明亮轻快', rules:'',
      attrs:[{name:'循环次数',type:'number',init:'1',hidden:false,reveal:false}],
      opening:'', at:'昨天'
    }),
    demoDraft({
      id:'d3', title:'', tag:'', theme:'star', themeSet:false,
      hook:'刀锋上落了雪,而他还没决定要不要拔出来。',
      background:'', style:'', rules:'', attrs:[], opening:'', at:'3 天前'
    })
  ];

  /* ---------------- 剪影 ---------------- */
  function figure(type){
    var head='<circle cx="50" cy="14" r="7.4"/>';
    var torso='<path d="M50 22c-5.4 0-9.4 3.6-10.1 8.7l-1.7 12.9c-.3 2.3 1.5 4.2 3.8 4.2h16c2.3 0 4.1-1.9 3.8-4.2l-1.7-12.9C59.4 25.6 55.4 22 50 22z"/>';
    var legs='<path d="M45.6 47 43.6 80" stroke-width="6" stroke-linecap="round" fill="none"/>'+
             '<path d="M54.4 47 56.4 80" stroke-width="6" stroke-linecap="round" fill="none"/>';
    var arms='';
    if(type==='gaze'){
      head='<circle cx="49" cy="13" r="7.4"/>';
      arms='<path d="M41 30 35 49" stroke-width="5" stroke-linecap="round" fill="none"/>'+
           '<path d="M59 30 66 47" stroke-width="5" stroke-linecap="round" fill="none"/>';
    }else if(type==='radio'){
      arms='<path d="M41 30 36 50" stroke-width="5" stroke-linecap="round" fill="none"/>'+
           '<path d="M59 31 64 38 57 23" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>'+
           '<rect x="53" y="15" width="6" height="9" rx="1.4"/>';
    }else if(type==='blade'){
      arms='<path d="M41 30 36 50" stroke-width="5" stroke-linecap="round" fill="none"/>'+
           '<path d="M59 30 64 50" stroke-width="5" stroke-linecap="round" fill="none"/>'+
           '<path d="M64 52 72 16" stroke-width="2.6" stroke-linecap="round" fill="none"/>';
    }else if(type==='umbrella'){
      arms='<path d="M41 30 36 50" stroke-width="5" stroke-linecap="round" fill="none"/>'+
           '<path d="M59 30 63 19" stroke-width="5" stroke-linecap="round" fill="none"/>'+
           '<path d="M63 19 63 8" stroke-width="2.2" stroke-linecap="round" fill="none"/>'+
           '<path d="M47 12q16-13 32 0z"/>';
    }else if(type==='reach'){
      arms='<path d="M41 30 29 19" stroke-width="5" stroke-linecap="round" fill="none"/>'+
           '<path d="M59 30 71 19" stroke-width="5" stroke-linecap="round" fill="none"/>';
    }else{
      legs='<path d="M45.6 47 40 79" stroke-width="6" stroke-linecap="round" fill="none"/>'+
           '<path d="M54.4 47 61 78" stroke-width="6" stroke-linecap="round" fill="none"/>';
      arms='<path d="M41 30 45 49" stroke-width="5" stroke-linecap="round" fill="none"/>'+
           '<path d="M59 30 55 49" stroke-width="5" stroke-linecap="round" fill="none"/>';
    }
    return '<svg viewBox="0 0 100 92" aria-hidden="true"><g fill="currentColor" stroke="currentColor">'
      + head + torso + legs + arms + '</g></svg>';
  }
  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function $(id){ return document.getElementById(id); }

  /* ---------------- 就绪判定:与 create-editor.html §7.7 同源 ---------------- */
  function ready(d){
    var attrsOk = false, i, seen = {};
    if(Array.isArray(d.attrs) && d.attrs.length){
      attrsOk = true;
      for(i=0;i<d.attrs.length;i++){
        var a = d.attrs[i] || {};
        var nm = String(a.name || '').trim();
        if(!nm || seen[nm]){ attrsOk = false; break; }
        if(a.type === 'number' && String(a.init || '').trim() !== '' && isNaN(Number(a.init))){ attrsOk = false; break; }
        seen[nm] = 1;
      }
    }
    var r = [
      String(d.hook || '').trim().length >= 8 && !!String(d.tag || '').trim(),
      !!String(d.background || '').trim() && !!String(d.style || '').trim() && !!String(d.rules || '').trim(),
      attrsOk,
      String(d.opening || '').trim().length >= 40,
      !!d.themeSet
    ];
    r.push(r[0] && r[1] && r[2] && r[3] && r[4]);
    return r;
  }
  function litCount(r){ var n = 0, i; for(i=0;i<r.length;i++){ if(r[i]) n++; } return n; }
  function firstGap(r){ var i; for(i=0;i<r.length;i++){ if(!r[i]) return i; } return -1; }

  /* ---------------- 缩略天空:只画点亮的层 ---------------- */
  function miniHTML(d, r){
    var t = theme(d.theme), h = t.h, html = '', i;
    if(!r[1] && !r[0]){
      return '<span class="dark">还是一片黑</span>';
    }
    if(r[1]){                                   /* 段 2 → 渐变天空 + 环境星点 */
      html += '<span class="l-sky"></span>';
      for(i=0;i<16;i++){
        var x = ((h*(i+3)*37) % 96) + 2;
        var y = ((h*(i+7)*19) % 50) + 3;
        html += '<span class="l-dot" style="left:'+x+'%;top:'+y+'%"></span>';
      }
    }
    if(r[2]){                                   /* 段 3 → 属性星:横向等分列,hue 决定纵向 */
      var vis = d.attrs.filter(function(a){ return a && !a.hidden; });
      for(i=0;i<vis.length;i++){
        var ax = ((i + 1) * 100 / (vis.length + 1));
        var ay = 14 + ((h * (i + 2)) % 26);
        html += '<span class="l-attr" style="left:'+ax.toFixed(1)+'%;top:'+ay+'%"></span>';
      }
    }
    if(r[4]){                                   /* 段 5 → 云层 + 流星痕 */
      html += '<span class="l-cloud c1"></span><span class="l-cloud c2"></span><span class="l-streak"></span>';
    }
    if(r[0]){                                   /* 段 1 → 地平线 */
      html += '<span class="l-horizon"></span>';
    }
    if(r[3]){                                   /* 段 4 → 剪影落位 */
      html += '<span class="l-fig">'+figure(t.f)+'</span>';
    }
    return html;
  }

  /* ---------------- 渲染 ---------------- */
  var drafts = [];

  function loadDrafts(){
    var out = [], removed = {};
    try{ removed = JSON.parse(window.localStorage.getItem(DEMO_KEY) || '{}') || {}; }catch(error){ removed = {}; }

    /* 编辑器里真实存在的那一份排在最前 */
    try{
      var raw = window.localStorage.getItem(EDITOR_KEY);
      if(raw){
        var s = JSON.parse(raw);
        if(s && typeof s === 'object'){
          s.id = 'local';
          s.local = true;
          s.at = '这台设备上正在编辑';
          out.push(s);
        }
      }
    }catch(error){}

    DEMO.forEach(function(d){ if(!removed[d.id]) out.push(d); });
    return out;
  }

  function paint(){
    var box = $('list'), html = '', i;
    $('count').textContent = drafts.length ? '共 ' + drafts.length + ' 份' : '';
    $('sub-n').textContent = String(drafts.length);

    if(!drafts.length){
      $('resume').hidden = true;
      box.className = '';
      box.innerHTML = '<div class="empty"><p>草稿箱是空的</p>'
        + '<small>写下第一句钩子,这里就会出现一片刚点起地平线的天空。</small>'
        + '<a class="btn-ghost" href="create-editor.html" data-od-id="cta-empty-create">写一个世界</a></div>';
      return;
    }
    box.className = 'list';

    /* 接着写:取最近的一份 */
    var top = drafts[0], tr = ready(top), gap = firstGap(tr);
    $('resume').style.setProperty('--hue', theme(top.theme).h);
    $('resume-eyebrow').textContent = top.local ? '这台设备上正在编辑' : '最近改过的一份';
    $('resume-title').textContent = top.title || '（还没起名字）';
    $('resume-where').textContent = gap === -1
      ? '六层都亮了,可以去段 6 做发布体检。'
      : '天空点亮 ' + litCount(tr) + '/6 层。下一步:段 ' + (gap + 1) + '「' + SEGS[gap] + '」——还缺' + LAYERS[gap] + '。';
    $('resume').hidden = false;

    for(i=0;i<drafts.length;i++){
      var d = drafts[i], r = ready(d), t = theme(d.theme);
      var g = firstGap(r);
      var trail = '';
      for(var j=0;j<6;j++){
        trail += '<span class="'+(r[j]?'on':'')+'">'+SEGS[j]+' · '+LAYERS[j]+'</span>';
      }
      html += '<article class="draft world-scope" style="--hue:'+t.h+'" data-od-id="draft-'+esc(d.id)+'">'
        + '<span class="mini" aria-hidden="true">'+miniHTML(d, r)+'</span>'
        + '<div class="meta">'
        +   '<h3 class="title"><a href="create-editor.html">'+esc(d.title || '（还没起名字）')+'</a>'
        +     (d.local ? '<span class="local">本机草稿</span>' : '') + '</h3>'
        +   '<p class="hook">'+esc(d.hook || '连一句钩子都还没有。')+'</p>'
        +   '<div class="trail" role="list" aria-label="六层完成度">'+trail+'</div>'
        +   '<p class="sub">' + esc(d.at) + ' · 点亮 ' + litCount(r) + '/6 层'
        +     (g === -1 ? ' · 可以发布了' : ' · 下一步是「' + SEGS[g] + '」') + '</p>'
        + '</div>'
        + '<div class="tools">'
        +   '<button class="icon-btn" type="button" data-del="'+esc(d.id)+'" data-name="'+esc(d.title || '（还没起名字）')+'"'
        +     ' aria-label="删除草稿：'+esc(d.title || '还没起名字的草稿')+'" data-od-id="cta-delete-'+esc(d.id)+'">'
        +     '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 7h15M9.5 7V5.2A1.2 1.2 0 0 1 10.7 4h2.6a1.2 1.2 0 0 1 1.2 1.2V7M6.6 7l.8 12a1.6 1.6 0 0 0 1.6 1.5h6a1.6 1.6 0 0 0 1.6-1.5l.8-12"/></svg>'
        +   '</button>'
        +   '<a class="open" href="create-editor.html" data-od-id="cta-open-'+esc(d.id)+'"'
        +     ' aria-label="打开草稿：'+esc(d.title || '还没起名字的草稿')+'">继续'
        +     '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg>'
        +   '</a>'
        + '</div>'
        + '</article>';
    }
    box.innerHTML = html;

    box.querySelectorAll('[data-del]').forEach(function(b){
      b.addEventListener('click', function(){ askDelete(b.dataset.del, b.dataset.name, b); });
    });
  }

  /* ---------------- 删除确认:Esc 关闭 / Tab 回环 / 焦点归位 ---------------- */
  var scrim = $('scrim'), dialog = $('dialog'), pendingId = null, lastFocused = null;

  function askDelete(id, name, trigger){
    pendingId = id;
    lastFocused = trigger;
    $('dlg-p').textContent = '《' + name + '》还没有发布过,删掉之后无法找回。它只存在于这台设备上。';
    scrim.hidden = false;
    $('dlg-cancel').focus();
  }
  function closeDialog(){
    scrim.hidden = true;
    pendingId = null;
    if(lastFocused && document.contains(lastFocused)) lastFocused.focus();
    else $('list').querySelector('.icon-btn') && $('list').querySelector('.icon-btn').focus();
  }
  $('dlg-cancel').addEventListener('click', closeDialog);
  $('dlg-ok').addEventListener('click', function(){
    var id = pendingId;
    if(!id){ closeDialog(); return; }
    if(id === 'local'){
      try{ window.localStorage.removeItem(EDITOR_KEY); }catch(error){}
    }else{
      try{
        var removed = JSON.parse(window.localStorage.getItem(DEMO_KEY) || '{}') || {};
        removed[id] = 1;
        window.localStorage.setItem(DEMO_KEY, JSON.stringify(removed));
      }catch(error){}
    }
    scrim.hidden = true;
    pendingId = null;
    drafts = loadDrafts();
    paint();
    say('草稿已删除。这台设备上不再保留它。');
    var next = $('list').querySelector('.icon-btn');
    if(next) next.focus();
  });
  scrim.addEventListener('click', function(e){ if(e.target === scrim) closeDialog(); });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && !scrim.hidden) closeDialog();
  });
  dialog.addEventListener('keydown', function(e){
    if(e.key !== 'Tab') return;
    var f = dialog.querySelectorAll('button:not([disabled]), a[href]');
    if(!f.length) return;
    var first = f[0], last = f[f.length - 1];
    if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  });

  /* ---------------- toast ---------------- */
  var toast = $('toast'), toastT;
  function say(msg){
    toast.textContent = msg;
    toast.classList.add('on');
    clearTimeout(toastT);
    toastT = setTimeout(function(){ toast.classList.remove('on'); }, 3200);
  }

  /* ---------------- 星点 ---------------- */
  (function(){
    var box = $('stars'), html = '', i;
    for(i=0;i<120;i++){
      var s = Math.random() < 0.86 ? 1 : 2;
      var o = (0.14 + Math.random()*0.54).toFixed(2);
      var tw = (!RM && Math.random() < 0.18)
        ? 'animation:twinkle '+(3+Math.random()*4).toFixed(1)+'s ease-in-out infinite;animation-delay:'+(Math.random()*5).toFixed(1)+'s;'
        : '';
      html += '<i style="left:'+(Math.random()*100).toFixed(2)+'%;top:'+(Math.random()*100).toFixed(2)
           + '%;width:'+s+'px;height:'+s+'px;opacity:'+o+';'+tw+'"></i>';
    }
    box.innerHTML = html;
  })();

  drafts = loadDrafts();
  paint();
})();
</script>
</body>
</html>
