name: CI

# 三个进程各跑各的门禁，互不阻塞：改前端不该等 Go 测试，反之亦然。
# 一律不连数据库、不连 LLM——CI 只证明「代码能编译、静态检查过、纯逻辑单测过」。
# 真实叙事质量必须靠真人多回合试玩（docs/handoff.md §8.3），CI 替代不了。
on:
  push:
    branches: [main]
  pull_request:

# 同一分支上新的推送取消旧的在跑任务，省 runner。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go build ./...
      - run: go vet ./...
      # -race：属性合并与流式落库都有并发路径，数据竞争在这类代码里最难靠人眼发现
      - run: go test -race ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint          # --max-warnings 0：警告即失败，否则门禁只是摆设
      - run: npm run typecheck
      - run: npm run build

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app
      # agent 不持有任何凭据，单测全是纯函数（prepare/normalize/review 判定），不需要 key
      - run: python -m unittest discover -s tests
